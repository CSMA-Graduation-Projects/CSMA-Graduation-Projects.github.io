<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2697" viewBox="0 0 920 2697" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Engineering: from requirements to acceptance</title><desc id="diagram-desc">Connect design, implementation, testing and acceptance for capstones and competition projects. Solid arrows move downwards, gold diamonds are decisions, and dashed lines return after correction.Choose tools according to risk and task size. A working interface is partial evidence; delivery should cover core requirements, failure cases and usage boundaries.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2697" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0" textLength="552.925" lengthAdjust="spacingAndGlyphs">Engineering: from requirements to acceptance</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="599.186" lengthAdjust="spacingAndGlyphs">Connect design, implementation, testing and acceptance for capstones and competition projects.</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="742.820" lengthAdjust="spacingAndGlyphs">Follow the downward route; unmet conditions lead to the right-hand correction branch, then return along the dashed line. Select a</tspan><tspan x="36" dy="20.150000000000002" textLength="141.635" lengthAdjust="spacingAndGlyphs">node for its online guide.</tspan></text><text x="458" y="822.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="design-check" data-to="design-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 885.5 L 543 834.0" /><text x="548" y="945" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="182.314" lengthAdjust="spacingAndGlyphs">↶ Return to requirements and design</tspan></text><path class="flow-edge" data-from="design-revise" data-to="requirements" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 834.0 L 879 834.0 L 879 180 L 422 180 L 422 196" /><text x="458" y="2029.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="accept-check" data-to="accept-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2073.0 L 543 2041.0" /><text x="548" y="2152" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="202.488" lengthAdjust="spacingAndGlyphs">↶ Return to implementation and retesting</tspan></text><path class="flow-edge" data-from="accept-revise" data-to="implement" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 2041.0 L 889 2041.0 L 889 1122 L 422 1122 L 422 1138" /><path class="flow-edge" data-from="requirements" data-to="design" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 364 L 240.0 474" /><path class="flow-edge" data-from="design" data-to="design-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 629 L 240.0 739" /><text x="254.0" y="1057" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="design-check" data-to="implement" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1027 L 240.0 1137" /><path class="flow-edge" data-from="implement" data-to="test" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1292 L 240.0 1402" /><path class="flow-edge" data-from="test" data-to="accept" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1557 L 240.0 1667" /><path class="flow-edge" data-from="accept" data-to="accept-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1836 L 240.0 1946" /><text x="254.0" y="2225" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="accept-check" data-to="deliver" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2195 L 240.0 2305" /><g class="flow-node" data-node-id="requirements" aria-label="Specify requirements and acceptance conditions. Confirm user scenarios, scope, individual responsibility and measurable goals."><a href="https://csma-graduation-projects.github.io/en/templates.html#engineering-report" target="_blank"><title>Specify requirements and acceptance conditions: Confirm user scenarios, scope, individual responsibility and measurable goals.</title><rect x="36" y="200" width="408" height="164" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="225" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="250" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="287.216" lengthAdjust="spacingAndGlyphs">Specify requirements and acceptance</tspan><tspan x="55" dy="22" textLength="80.896" lengthAdjust="spacingAndGlyphs">conditions</tspan></text><text x="55" y="297" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="341.003" lengthAdjust="spacingAndGlyphs">Confirm user scenarios, scope, individual responsibility and</tspan><tspan x="55" dy="20" textLength="106.210" lengthAdjust="spacingAndGlyphs">measurable goals.</tspan></text></a></g><g class="flow-node" data-node-id="design" aria-label="Detailed design and critical prototypes. Describe interfaces, data, error handling and dependencies. Test high-risk elements first."><a href="https://csma-graduation-projects.github.io/en/bachelor.html#design" target="_blank"><title>Detailed design and critical prototypes: Describe interfaces, data, error handling and dependencies. Test high-risk elements first.</title><rect x="36" y="479" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="504" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="529" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="294.304" lengthAdjust="spacingAndGlyphs">Detailed design and critical prototypes</tspan></text><text x="55" y="554" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="344.669" lengthAdjust="spacingAndGlyphs">Describe interfaces, data, error handling and dependencies.</tspan><tspan x="55" dy="20" textLength="162.539" lengthAdjust="spacingAndGlyphs">Test high-risk elements first.</tspan></text></a></g><g class="flow-node" data-node-id="design-check" aria-label="Can the design meet core acceptance conditions?. Critical dependencies and the technical approach have passed small tests."><a href="https://csma-graduation-projects.github.io/en/bachelor.html#design" target="_blank"><title>Can the design meet core acceptance conditions?: Critical dependencies and the technical approach have passed small tests.</title><polygon points="240.0,744 444,885.5 240.0,1027 36,885.5" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="851.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="194.720" lengthAdjust="spacingAndGlyphs">Can the design meet core</tspan><tspan x="240.0" dy="22" textLength="181.392" lengthAdjust="spacingAndGlyphs">acceptance conditions?</tspan></text><text x="240.0" y="899.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="158.076" lengthAdjust="spacingAndGlyphs">Critical dependencies and the</tspan><tspan x="240.0" dy="17" textLength="203.424" lengthAdjust="spacingAndGlyphs">technical approach have passed small</tspan><tspan x="240.0" dy="17" textLength="28.680" lengthAdjust="spacingAndGlyphs">tests.</tspan></text></a></g><g class="flow-node" data-node-id="design-revise" aria-label="Revise and review. Clarify requirements or change the design. Record the impact of significant scope changes and obtain agreement."><a href="https://csma-graduation-projects.github.io/en/templates.html#change-request" target="_blank"><title>Revise and review: Clarify requirements or change the design. Record the impact of significant scope changes and obtain agreement.</title><rect x="548" y="744" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="769" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="794" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="138.736" lengthAdjust="spacingAndGlyphs">Revise and review</tspan></text><text x="567" y="819" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="244.933" lengthAdjust="spacingAndGlyphs">Clarify requirements or change the design.</tspan><tspan x="567" dy="20" textLength="219.648" lengthAdjust="spacingAndGlyphs">Record the impact of significant scope</tspan><tspan x="567" dy="20" textLength="182.832" lengthAdjust="spacingAndGlyphs">changes and obtain agreement.</tspan></text></a></g><g class="flow-node" data-node-id="implement" aria-label="Implement a complete minimal user journey. Expand through version control and task records while keeping run instructions usable."><a href="https://csma-graduation-projects.github.io/en/bachelor.html#implementation" target="_blank"><title>Implement a complete minimal user journey: Expand through version control and task records while keeping run instructions usable.</title><rect x="36" y="1142" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1167" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1192" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="333.440" lengthAdjust="spacingAndGlyphs">Implement a complete minimal user journey</tspan></text><text x="55" y="1217" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="361.998" lengthAdjust="spacingAndGlyphs">Expand through version control and task records while keeping</tspan><tspan x="55" dy="20" textLength="133.666" lengthAdjust="spacingAndGlyphs">run instructions usable.</tspan></text></a></g><g class="flow-node" data-node-id="test" aria-label="Test and organize evidence. Cover core functions, boundary cases and failures; record the environment and results."><a href="https://csma-graduation-projects.github.io/en/bachelor.html#validation" target="_blank"><title>Test and organize evidence: Cover core functions, boundary cases and failures; record the environment and results.</title><rect x="36" y="1407" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1432" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1457" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="208.960" lengthAdjust="spacingAndGlyphs">Test and organize evidence</tspan></text><text x="55" y="1482" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="354.770" lengthAdjust="spacingAndGlyphs">Cover core functions, boundary cases and failures; record the</tspan><tspan x="55" dy="20" textLength="142.337" lengthAdjust="spacingAndGlyphs">environment and results.</tspan></text></a></g><g class="flow-node" data-node-id="accept" aria-label="Demonstrate and accept against requirements. Check the deliverable version, explaining implemented scope, defects and limitations."><a href="https://csma-graduation-projects.github.io/en/templates.html#engineering-report" target="_blank"><title>Demonstrate and accept against requirements: Check the deliverable version, explaining implemented scope, defects and limitations.</title><rect x="36" y="1672" width="408" height="164" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1697" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1722" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="246.288" lengthAdjust="spacingAndGlyphs">Demonstrate and accept against</tspan><tspan x="55" dy="22" textLength="101.360" lengthAdjust="spacingAndGlyphs">requirements</tspan></text><text x="55" y="1769" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="356.200" lengthAdjust="spacingAndGlyphs">Check the deliverable version, explaining implemented scope,</tspan><tspan x="55" dy="20" textLength="132.223" lengthAdjust="spacingAndGlyphs">defects and limitations.</tspan></text></a></g><g class="flow-node" data-node-id="accept-check" aria-label="Do the core goals pass acceptance?. Planned features are not described as already implemented."><a href="https://csma-graduation-projects.github.io/en/templates.html#engineering-report" target="_blank"><title>Do the core goals pass acceptance?: Planned features are not described as already implemented.</title><polygon points="240.0,1951 444,2073.0 240.0,2195 36,2073.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="2047.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="175.168" lengthAdjust="spacingAndGlyphs">Do the core goals pass</tspan><tspan x="240.0" dy="22" textLength="96.048" lengthAdjust="spacingAndGlyphs">acceptance?</tspan></text><text x="240.0" y="2095.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="202.776" lengthAdjust="spacingAndGlyphs">Planned features are not described as</tspan><tspan x="240.0" dy="17" textLength="114.708" lengthAdjust="spacingAndGlyphs">already implemented.</tspan></text></a></g><g class="flow-node" data-node-id="accept-revise" aria-label="Revise and review. Fix defects and retest. If goals cannot be met, revise the scope and explanation, then seek renewed agreement."><a href="https://csma-graduation-projects.github.io/en/templates.html#engineering-report" target="_blank"><title>Revise and review: Fix defects and retest. If goals cannot be met, revise the scope and explanation, then seek renewed agreement.</title><rect x="548" y="1951" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1976" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="2001" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="138.736" lengthAdjust="spacingAndGlyphs">Revise and review</tspan></text><text x="567" y="2026" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="234.130" lengthAdjust="spacingAndGlyphs">Fix defects and retest. If goals cannot be</tspan><tspan x="567" dy="20" textLength="251.472" lengthAdjust="spacingAndGlyphs">met, revise the scope and explanation, then</tspan><tspan x="567" dy="20" textLength="150.293" lengthAdjust="spacingAndGlyphs">seek renewed agreement.</tspan></text></a></g><g class="flow-node" data-node-id="deliver" aria-label="Release or hand over the agreed version. Confirm publication permission, dependency licenses, rollback procedures and receipt."><a href="https://csma-graduation-projects.github.io/en/templates.html#handover" target="_blank"><title>Release or hand over the agreed version: Confirm publication permission, dependency licenses, rollback procedures and receipt.</title><rect x="36" y="2310" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2335" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="130.229" lengthAdjust="spacingAndGlyphs">Completion and next steps</tspan></text><text x="55" y="2360" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="308.560" lengthAdjust="spacingAndGlyphs">Release or hand over the agreed version</tspan></text><text x="55" y="2385" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="358.345" lengthAdjust="spacingAndGlyphs">Confirm publication permission, dependency licenses, rollback</tspan><tspan x="55" dy="20" textLength="136.565" lengthAdjust="spacingAndGlyphs">procedures and receipt.</tspan></text></a></g><text x="36" y="2600" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="710.944" lengthAdjust="spacingAndGlyphs">Scope and limits: Choose tools according to risk and task size. A working interface is partial evidence; delivery should cover</tspan><tspan x="36" dy="21" textLength="320.814" lengthAdjust="spacingAndGlyphs">core requirements, failure cases and usage boundaries.</tspan></text><text x="36" y="2674" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="482.955" lengthAdjust="spacingAndGlyphs">CSMA Student Guide · https://csma-graduation-projects.github.io/en/workflows.html#flow-engineering</tspan></text></svg>
