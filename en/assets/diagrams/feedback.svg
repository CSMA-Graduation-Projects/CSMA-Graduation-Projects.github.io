sk-status" target="_blank"><title>Complete the review and plan the next cycle: Record the evidence for completion; give continuing work a new set of goals.</title><rect x="36" y="2056" width="408" height="164" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2081" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="130.229" lengthAdjust="spacingAndGlyphs">Completion and next steps</tspan></text><text x="55" y="2106" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="291.632" lengthAdjust="spacingAndGlyphs">Complete the review and plan the next</tspan><tspan x="55" dy="22" textLength="40.032" lengthAdjust="spacingAndGlyphs">cycle</tspan></text><text x="55" y="2153" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="340.314" lengthAdjust="spacingAndGlyphs">Record the evidence for completion; give continuing work a</tspan><tspan x="55" dy="20" textLength="97.552" lengthAdjust="spacingAndGlyphs">new set of goals.</tspan></text></a></g><text x="36" y="2360" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="700.843" lengthAdjust="spacingAndGlyphs">Scope and limits: Students and supervisors agree on a working rhythm that fits coursework and research. Use institutional</tspan><tspan x="36" dy="21" textLength="495.690" lengthAdjust="spacingAndGlyphs">rules and designated channels for formal attendance, leave, practice and assessment.</tspan></text><text x="36" y="2434" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="470.118" lengthAdjust="spacingAndGlyphs">CSMA Student Guide · https://csma-graduation-projects.github.io/en/workflows.html#flow-feedback</tspan></text></svg>
