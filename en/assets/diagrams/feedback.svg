fter a deadline."><a href="https://csma-graduation-projects.github.io/en/management.html#working-rhythm" target="_blank"><title>Are inputs, resources and arrangements still workable?: Seek help early when blocked. Do not fabricate progress after a deadline.</title><polygon points="240.0,730 444,865.0 240.0,1000 36,865.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="839.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="197.392" lengthAdjust="spacingAndGlyphs">Are inputs, resources and</tspan><tspan x="240.0" dy="22" textLength="220.528" lengthAdjust="spacingAndGlyphs">arrangements still workable?</tspan></text><text x="240.0" y="887.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="201.432" lengthAdjust="spacingAndGlyphs">Seek help early when blocked. Do not</tspan><tspan x="240.0" dy="17" textLength="185.424" lengthAdjust="spacingAndGlyphs">fabricate progress after a deadline.</tspan></text></a></g><g class="flow-node" data-node-id="work-revise" aria-label="Revise and review. Explain causes and alternatives. Agree on a smaller scope, a revised date or a necessary formal change."><a href="https://csma-graduation-projects.github.io/en/templates.html#change-request" target="_blank"><title>Revise and review: Explain causes and alternatives. Agree on a smaller scope, a revised date or a necessary formal change.</title><rect x="548" y="730" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="755" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="780" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="138.736" lengthAdjust="spacingAndGlyphs">Revise and review</tspan></text><text x="567" y="805" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="253.630" lengthAdjust="spacingAndGlyphs">Explain causes and alternatives. Agree on a</tspan><tspan x="567" dy="20" textLength="257.933" lengthAdjust="spacingAndGlyphs">smaller scope, a revised date or a necessary</tspan><tspan x="567" dy="20" textLength="85.982" lengthAdjust="spacingAndGlyphs">formal change.</tspan></text></a></g><g class="flow-node" data-node-id="report" aria-label="Submit a weekly report and discussion points. Distinguish facts, interpretations and plans; attach accessible evidence."><a href="https://csma-graduation-projects.github.io/en/templates.html#weekly" target="_blank"><title>Submit a weekly report and discussion points: Distinguish facts, interpretations and plans; attach accessible evidence.</title><rect x="36" y="1115" width="408" height="164" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1140" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1165" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="296.096" lengthAdjust="spacingAndGlyphs">Submit a weekly report and discussion</tspan><tspan x="55" dy="22" textLength="48.000" lengthAdjust="spacingAndGlyphs">points</tspan></text><text x="55" y="1212" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="351.156" lengthAdjust="spacingAndGlyphs">Distinguish facts, interpretations and plans; attach accessible</tspan><tspan x="55" dy="20" textLength="55.640" lengthAdjust="spacingAndGlyphs">evidence.</tspan></text></a></g><g class="flow-node" data-node-id="feedback" aria-label="Discuss and record action items. Record decisions, unresolved questions, revision locations, owners and deadlines."><a href="https://csma-graduation-projects.github.io/en/templates.html#meeting" target="_blank"><title>Discuss and record action items: Record decisions, unresolved questions, revision locations, owners and deadlines.</title><rect x="36" y="1394" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1419" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1444" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="246.304" lengthAdjust="spacingAndGlyphs">Discuss and record action items</tspan></text><text x="55" y="1469" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="340.301" lengthAdjust="spacingAndGlyphs">Record decisions, unresolved questions, revision locations,</tspan><tspan x="55" dy="20" textLength="130.065" lengthAdjust="spacingAndGlyphs">owners and deadlines.</tspan></text></a></g><g class="flow-node" data-node-id="feedback-check" aria-label="Does the delivery meet the agreed conditions?. Actual materials support completion status. Record official assessment outcomes separately."><a href="https://csma-graduation-projects.github.io/en/templates.html#meeting" target="_blank"><title>Does the delivery meet the agreed conditions?: Actual materials support completion status. Record official assessment outcomes separately.</title><polygon points="240.0,1659 444,1800.0 240.0,1941 36,1800.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1765.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="202.736" lengthAdjust="spacingAndGlyphs">Does the delivery meet the</tspan><tspan x="240.0" dy="22" textLength="146.704" lengthAdjust="spacingAndGlyphs">agreed conditions?</tspan></text><text x="240.0" y="1813.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middl