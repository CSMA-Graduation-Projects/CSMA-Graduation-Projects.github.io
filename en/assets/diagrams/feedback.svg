="#426a71" marker-end="url(#arrow)" d="M 240.0 615 L 240.0 725" /><text x="254.0" y="1030" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="work-check" data-to="report" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1000 L 240.0 1110" /><path class="flow-edge" data-from="report" data-to="feedback" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1279 L 240.0 1389" /><path class="flow-edge" data-from="feedback" data-to="feedback-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1544 L 240.0 1654" /><text x="254.0" y="1971" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="feedback-check" data-to="close" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1941 L 240.0 2051" /><g class="flow-node" data-node-id="plan" aria-label="Agree on goals and completion conditions. Specify tasks, owners, inputs, deliverables, review dates and support needed."><a href="https://csma-graduation-projects.github.io/en/templates.html#research-task" target="_blank"><title>Agree on goals and completion conditions: Specify tasks, owners, inputs, deliverables, review dates and support needed.</title><rect x="36" y="200" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="225" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="250" font-size="16" fill="#14375f" font-weight="70