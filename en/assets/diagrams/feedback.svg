<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2457" viewBox="0 0 920 2457" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Routine work: tasks, feedback and next steps</title><desc id="diagram-desc">Turn each discussion into deliverable tasks, owners, evidence and review dates. Solid arrows move downwards, gold diamonds are decisions, and dashed lines return after correction.Students and supervisors agree on a working rhythm that fits coursework and research. Use institutional rules and designated channels for formal attendance, leave, practice and assessment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2457" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0" textLength="540.450" lengthAdjust="spacingAndGlyphs">Routine work: tasks, feedback and next steps</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="497.210" lengthAdjust="spacingAndGlyphs">Turn each discussion into deliverable tasks, owners, evidence and review dates.</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="742.820" lengthAdjust="spacingAndGlyphs">Follow the downward route; unmet conditions lead to the right-hand correction branch, then return along the dashed line. Select a</tspan><tspan x="36" dy="20.150000000000002" textLength="141.635" lengthAdjust="spacingAndGlyphs">node for its online guide.</tspan></text><text x=