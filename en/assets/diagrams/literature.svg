<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2761" viewBox="0 0 920 2761" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Literature: from search to research positioning</title><desc id="diagram-desc">Connect search records, source checks, comparison matrices and topic decisions. Solid arrows move downwards, gold diamonds are decisions, and dashed lines return after correction.Record published results, local replication results and untested hypotheses separately. If the problem is already solved, revise the question rather than merely renaming it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2761" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0" textLength="555.700" lengthAdjust="spacingAndGlyphs">Literature: from search to research positioning</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="509.628" lengthAdjust="spacingAndGlyphs">Connect search records, source checks, comparison matrices and topic decisions.</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="742.820" lengthAdjust="spacingAndGlyphs">Follow the downward route; unmet conditions lead to the right-hand correction branch, then return along the dashed line. Select a</tspan><tspan x="36" dy="20.150000000000002" textLength="141.635" lengthAdjust="spacingAndGlyphs">node for its online guide.</tspan></text><text x="458" y="1073.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="read-check" data-to="read-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1147.0 L 543 1085.0" /><text x="548" y="1196" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="166.419" lengthAdjust="spacingAndGlyphs">↶ Return to search and screening</tspan></text><path class="flow-edge" data-from="read-revise" data-to="search" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 1085.0 L 879 1085.0 L 879 445 L 422 445 L 422 461" /><text x="458" y="2036.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="position-check" data-to="position-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2108.5 L 543 2048.0" /><text x="548" y="2159" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="149.919" lengthAdjust="spacingAndGlyphs">↶ Return to question definition</tspan></text><path class="flow-edge" data-from="position-revise" data-to="question" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 2048.0 L 889 2048.0 L 889 180 L 422 180 L 422 196" /><path class="flow-edge" data-from="question" data-to="search" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 350 L 240.0 460" /><path class="flow-edge" data-from="search" data-to="read" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 615 L 240.0 725" /><path class="flow-edge" data-from="read" data-to="read-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 880 L 240.0 990" /><text x="254.0" y="1329" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="read-check" data-to="compare" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1299 L 240.0 1409" /><path class="flow-edge" data-from="compare" data-to="position" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1564 L 240.0 1674" /><path class="flow-edge" data-from="position" data-to="position-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1843 L 240.0 1953" /><text x="254.0" y="2289" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="position-check" data-to="maintain" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2259 L 240.0 2369" /><g class="flow-node" data-node-id="question" aria-label="Define the question and search boundaries. Specify key concepts, synonyms, databases, date range and inclusion/exclusion criteria."><a href="https://csma-graduation-projects.github.io/en/templates.html#literature" target="_blank"><title>Define the question and search boundaries: Specify key concepts, synonyms, databases, date range and inclusion/exclusion criteria.</title><rect x="36" y="200" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="225" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="250" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="328.080" lengthAdjust="spacingAndGlyphs">Define the question and search boundaries</tspan></text><text x="55" y="275" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="349.739" lengthAdjust="spacingAndGlyphs">Specify key concepts, synonyms, databases, date range and</tspan><tspan x="55" dy="20" textLength="154.596" lengthAdjust="spacingAndGlyphs">inclusion/exclusion criteria.</tspan></text></a></g><g class="flow-node" data-node-id="search" aria-label="Search, deduplicate and screen. Save search queries and dates, record inclusion/exclusion reasons and obtain lawful full-text access."><a href="https://csma-graduation-projects.github.io/en/templates.html#literature" target="_blank"><title>Search, deduplicate and screen: Save search queries and dates, record inclusion/exclusion reasons and obtain lawful full-text access.</title><rect x="36" y="465" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="490" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="515" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="240.096" lengthAdjust="spacingAndGlyphs">Search, deduplicate and screen</tspan></text><text x="55" y="540" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="335.257" lengthAdjust="spacingAndGlyphs">Save search queries and dates, record inclusion/exclusion</tspan><tspan x="55" dy="20" textLength="240.604" lengthAdjust="spacingAndGlyphs">reasons and obtain lawful full-text access.</tspan></text></a></g><g class="flow-node" data-node-id="read" aria-label="Read closely and check original sources. Check methods, data, evaluation definitions, limitations and contrary evidence; trace citations."><a href="https://csma-graduation-projects.github.io/en/templates.html#reading" target="_blank"><title>Read closely and check original sources: Check methods, data, evaluation definitions, limitations and contrary evidence; trace citations.</title><rect x="36" y="730" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="755" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="780" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="308.576" lengthAdjust="spacingAndGlyphs">Read closely and check original sources</tspan></text><text x="55" y="805" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="341.770" lengthAdjust="spacingAndGlyphs">Check methods, data, evaluation definitions, limitations and</tspan><tspan x="55" dy="20" textLength="193.635" lengthAdjust="spacingAndGlyphs">contrary evidence; trace citations.</tspan></text></a></g><g class="flow-node" data-node-id="read-check" aria-label="Is key evidence covered and verifiable?. Check representative studies and contrary findings. Reference counts do not establish quality."><a href="https://csma-graduation-projects.github.io/en/templates.html#reading" target="_blank"><title>Is key evidence covered and verifiable?: Check representative studies and contrary findings. Reference counts do not establish quality.</title><polygon points="240.0,995 444,1147.0 240.0,1299 36,1147.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1112.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="216.112" lengthAdjust="spacingAndGlyphs">Is key evidence covered and</tspan><tspan x="240.0" dy="22" textLength="79.152" lengthAdjust="spacingAndGlyphs">verifiable?</tspan></text><text x="240.0" y="1160.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="178.080" lengthAdjust="spacingAndGlyphs">Check representative studies and</tspan><tspan x="240.0" dy="17" textLength="188.748" lengthAdjust="spacingAndGlyphs">contrary findings. Reference counts</tspan><tspan x="240.0" dy="17" textLength="125.400" lengthAdjust="spacingAndGlyphs">do not establish quality.</tspan></text></a></g><g class="flow-node" data-node-id="read-revise" aria-label="Revise and review. Extend the search, trace original sources or mark evidence as unverifiable. Do not cite fabricated references."><a href="https://csma-graduation-projects.github.io/en/templates.html#literature" target="_blank"><title>Revise and review: Extend the search, trace original sources or mark evidence as unverifiable. Do not cite fabricated references.</title><rect x="548" y="995" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1020" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="1045" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="138.736" lengthAdjust="spacingAndGlyphs">Revise and review</tspan></text><text x="567" y="1070" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="250.718" lengthAdjust="spacingAndGlyphs">Extend the search, trace original sources or</tspan><tspan x="567" dy="20" textLength="241.319" lengthAdjust="spacingAndGlyphs">mark evidence as unverifiable. Do not cite</tspan><tspan x="567" dy="20" textLength="125.723" lengthAdjust="spacingAndGlyphs">fabricated references.</tspan></text></a></g><g class="flow-node" data-node-id="compare" aria-label="Build an evidence matrix and review. Compare questions and methods, marking papers read, unavailable full texts and unresolved checks."><a href="https://csma-graduation-projects.github.io/en/master.html#survey" target="_blank"><title>Build an evidence matrix and review: Compare questions and methods, marking papers read, unavailable full texts and unresolved checks.</title><rect x="36" y="1414" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1439" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1464" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="275.664" lengthAdjust="spacingAndGlyphs">Build an evidence matrix and review</tspan></text><text x="55" y="1489" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="321.529" lengthAdjust="spacingAndGlyphs">Compare questions and methods, marking papers read,</tspan><tspan x="55" dy="20" textLength="257.231" lengthAdjust="spacingAndGlyphs">unavailable full texts and unresolved checks.</tspan></text></a></g><g class="flow-node" data-node-id="position" aria-label="Position the research and define validation tasks. Identify the closest work, differences, value and testable hypotheses."><a href="https://csma-graduation-projects.github.io/en/templates.html#topic" target="_blank"><title>Position the research and define validation tasks: Identify the closest work, differences, value and testable hypotheses.</title><rect x="36" y="1679" width="408" height="164" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1704" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1729" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="326.320" lengthAdjust="spacingAndGlyphs">Position the research and define validation</tspan><tspan x="55" dy="22" textLength="40.912" lengthAdjust="spacingAndGlyphs">tasks</tspan></text><text x="55" y="1776" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="322.270" lengthAdjust="spacingAndGlyphs">Identify the closest work, differences, value and testable</tspan><tspan x="55" dy="20" textLength="70.096" lengthAdjust="spacingAndGlyphs">hypotheses.</tspan></text></a></g><g class="flow-node" data-node-id="position-check" aria-label="Does the question still merit research?. The difference is real, and the scope and resources support a meaningful test."><a href="https://csma-graduation-projects.github.io/en/templates.html#topic" target="_blank"><title>Does the question still merit research?: The difference is real, and the scope and resources support a meaningful test.</title><polygon points="240.0,1958 444,2108.5 240.0,2259 36,2108.5" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="2074.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="214.272" lengthAdjust="spacingAndGlyphs">Does the question still merit</tspan><tspan x="240.0" dy="22" textLength="75.600" lengthAdjust="spacingAndGlyphs">research?</tspan></text><text x="240.0" y="2122.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="194.100" lengthAdjust="spacingAndGlyphs">The difference is real, and the scope</tspan><tspan x="240.0" dy="17" textLength="191.424" lengthAdjust="spacingAndGlyphs">and resources support a meaningful</tspan><tspan x="240.0" dy="17" textLength="22.680" lengthAdjust="spacingAndGlyphs">test.</tspan></text></a></g><g class="flow-node" data-node-id="position-revise" aria-label="Revise and review. Narrow the question, change direction or stop this candidate topic, preserving the reasoning."><a href="https://csma-graduation-projects.github.io/en/templates.html#topic" target="_blank"><title>Revise and review: Narrow the question, change direction or stop this candidate topic, preserving the reasoning.</title><rect x="548" y="1958" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1983" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="2008" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="138.736" lengthAdjust="spacingAndGlyphs">Revise and review</tspan></text><text x="567" y="2033" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="234.104" lengthAdjust="spacingAndGlyphs">Narrow the question, change direction or</tspan><tspan x="567" dy="20" textLength="229.060" lengthAdjust="spacingAndGlyphs">stop this candidate topic, preserving the</tspan><tspan x="567" dy="20" textLength="60.697" lengthAdjust="spacingAndGlyphs">reasoning.</tspan></text></a></g><g class="flow-node" data-node-id="maintain" aria-label="Keep the reference collection current. Save reference metadata, reading notes and reasons for changes in research positioning."><a href="https://csma-graduation-projects.github.io/en/archive.html#archive-metadata" target="_blank"><title>Keep the reference collection current: Save reference metadata, reading notes and reasons for changes in research positioning.</title><rect x="36" y="2374" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2399" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="130.229" lengthAdjust="spacingAndGlyphs">Completion and next steps</tspan></text><text x="55" y="2424" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="282.752" lengthAdjust="spacingAndGlyphs">Keep the reference collection current</tspan></text><text x="55" y="2449" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="325.897" lengthAdjust="spacingAndGlyphs">Save reference metadata, reading notes and reasons for</tspan><tspan x="55" dy="20" textLength="186.420" lengthAdjust="spacingAndGlyphs">changes in research positioning.</tspan></text></a></g><text x="36" y="2664" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="696.527" lengthAdjust="spacingAndGlyphs">Scope and limits: Record published results, local replication results and untested hypotheses separately. If the problem is</tspan><tspan x="36" dy="21" textLength="380.770" lengthAdjust="spacingAndGlyphs">already solved, revise the question rather than merely renaming it.</tspan></text><text x="36" y="2738" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="468.270" lengthAdjust="spacingAndGlyphs">CSMA Student Guide · https://csma-graduation-projects.github.io/en/workflows.html#flow-literature</tspan></text></svg>
