<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2776" viewBox="0 0 920 2776" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">From first contact to research collaboration</title><desc id="diagram-desc">Six practical steps connect your interests with an agreed research or competition project. Two shared decisions keep the work suitable for both sides. Solid arrows move downwards, gold diamonds are decisions, and dashed lines return after correction.This is an invitation to discuss collaboration, not a promise of a place, funding or admission. Timing and arrangements are agreed individually; pausing or concluding is a valid outcome. Formal procedures apply only where relevant.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2776" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0" textLength="518.175" lengthAdjust="spacingAndGlyphs">From first contact to research collaboration</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="779.646" lengthAdjust="spacingAndGlyphs">Six practical steps connect your interests with an agreed research or competition project. Two shared decisions keep the work</tspan><tspan x="36" dy="22" textLength="140.070" lengthAdjust="spacingAndGlyphs">suitable for both sides.</tspan></text><text x="36" y="145" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="742.820" lengthAdjust="spacingAndGlyphs">Follow the downward route; unmet conditions lead to the right-hand correction branch, then return along the dashed line. Select a</tspan><tspan x="36" dy="20.150000000000002" textLength="141.635" lengthAdjust="spacingAndGlyphs">node for its online guide.</tspan></text><path class="flow-edge" data-from="interest" data-to="contact" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 372 L 240.0 482" /><path class="flow-edge" data-from="contact" data-to="discussion" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 637 L 240.0 747" /><path class="flow-edge" data-from="discussion" data-to="ready" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 902 L 240.0 1012" /><text x="254.0" y="1333" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="123.396" lengthAdjust="spacingAndGlyphs">When both sides agree</tspan></text><path class="flow-edge" data-from="ready" data-to="task" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1303 L 240.0 1413" /><text x="458" y="1097.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="ready" data-to="adjust" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1160.0 L 543 1109.0" /><text x="548" y="1222" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="173.756" lengthAdjust="spacingAndGlyphs">↶ If continuing, return to discussion</tspan></text><path class="flow-edge" data-from="adjust" data-to="discussion" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 1109.0 L 874 1109.0 L 874 732 L 422 732 L 422 748" /><path class="flow-edge" data-from="task" data-to="feedback" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1568 L 240.0 1678" /><path class="flow-edge" data-from="feedback" data-to="continue" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1833 L 240.0 1943" /><text x="254.0" y="2290" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="132.048" lengthAdjust="spacingAndGlyphs">When both sides confirm</tspan></text><path class="flow-edge" data-from="continue" data-to="collaborate" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2260 L 240.0 2370" /><text x="458" y="2028.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="continue" data-to="replan" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2104.0 L 543 2040.0" /><text x="548" y="2153" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="151.129" lengthAdjust="spacingAndGlyphs">↶ If trying again, discuss anew</tspan></text><path class="flow-edge" data-from="replan" data-to="discussion" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 2040.0 L 874 2040.0 L 874 732 L 422 732 L 422 748" /><g class="flow-node" data-node-id="interest" aria-label="Choose a question to explore. Use the published research directions to describe your interests and learning goals."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#directions" target="_blank"><title>Choose a question to explore: Use the published research directions to describe your interests and learning goals.</title><rect x="36" y="222" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="247" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="272" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="224.048" lengthAdjust="spacingAndGlyphs">Choose a question to explore</tspan></text><text x="55" y="297" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="313.573" lengthAdjust="spacingAndGlyphs">Use the published research directions to describe your</tspan><tspan x="55" dy="20" textLength="162.578" lengthAdjust="spacingAndGlyphs">interests and learning goals.</tspan></text></a></g><g class="flow-node" data-node-id="contact" aria-label="Send a short introduction. Describe your background, shareable work, availability, participation mode and language."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#contact" target="_blank"><title>Send a short introduction: Describe your background, shareable work, availability, participation mode and language.</title><rect x="36" y="487" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="512" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="537" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="194.688" lengthAdjust="spacingAndGlyphs">Send a short introduction</tspan></text><text x="55" y="562" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="317.889" lengthAdjust="spacingAndGlyphs">Describe your background, shareable work, availability,</tspan><tspan x="55" dy="20" textLength="192.218" lengthAdjust="spacingAndGlyphs">participation mode and language.</tspan></text></a></g><g class="flow-node" data-node-id="discussion" aria-label="Discuss interests and expectations. Discuss goals, preparation, supervision, resources and available time."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#fit" target="_blank"><title>Discuss interests and expectations: Discuss goals, preparation, supervision, resources and available time.</title><rect x="36" y="752" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="777" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="802" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="267.648" lengthAdjust="spacingAndGlyphs">Discuss interests and expectations</tspan></text><text x="55" y="827" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="315.731" lengthAdjust="spacingAndGlyphs">Discuss goals, preparation, supervision, resources and</tspan><tspan x="55" dy="20" textLength="83.083" lengthAdjust="spacingAndGlyphs">available time.</tspan></text></a></g><g class="flow-node" data-node-id="ready" aria-label="Can we agree on a suitable first task?. Both sides understand the task and feedback arrangements, and its conditions can be met."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#fit" target="_blank"><title>Can we agree on a suitable first task?: Both sides understand the task and feedback arrangements, and its conditions can be met.</title><polygon points="240.0,1017 444,1160.0 240.0,1303 36,1160.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1125.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="205.408" lengthAdjust="spacingAndGlyphs">Can we agree on a suitable</tspan><tspan x="240.0" dy="22" textLength="75.584" lengthAdjust="spacingAndGlyphs">first task?</tspan></text><text x="240.0" y="1173.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="188.112" lengthAdjust="spacingAndGlyphs">Both sides understand the task and</tspan><tspan x="240.0" dy="17" textLength="168.084" lengthAdjust="spacingAndGlyphs">feedback arrangements, and its</tspan><tspan x="240.0" dy="17" textLength="120.060" lengthAdjust="spacingAndGlyphs">conditions can be met.</tspan></text></a></g><g class="flow-node" data-node-id="adjust" aria-label="Adjust the direction, timing or preparation. Narrow the task or build foundations; either side may close the discussion and reconnect later."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#fit" target="_blank"><title>Adjust the direction, timing or preparation: Narrow the task or build foundations; either side may close the discussion and reconnect later.</title><rect x="548" y="1017" width="310" height="184" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1042" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="1067" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="227.584" lengthAdjust="spacingAndGlyphs">Adjust the direction, timing or</tspan><tspan x="567" dy="22" textLength="88.016" lengthAdjust="spacingAndGlyphs">preparation</tspan></text><text x="567" y="1114" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="247.832" lengthAdjust="spacingAndGlyphs">Narrow the task or build foundations; either</tspan><tspan x="567" dy="20" textLength="257.946" lengthAdjust="spacingAndGlyphs">side may close the discussion and reconnect</tspan><tspan x="567" dy="20" textLength="28.899" lengthAdjust="spacingAndGlyphs">later.</tspan></text></a></g><g class="flow-node" data-node-id="task" aria-label="Complete the agreed small task. Produce an explainable result, an honest work record and questions against the learning goal."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#first-task" target="_blank"><title>Complete the agreed small task: Produce an explainable result, an honest work record and questions against the learning goal.</title><rect x="36" y="1418" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1443" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1468" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="240.080" lengthAdjust="spacingAndGlyphs">Complete the agreed small task</tspan></text><text x="55" y="1493" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="332.384" lengthAdjust="spacingAndGlyphs">Produce an explainable result, an honest work record and</tspan><tspan x="55" dy="20" textLength="204.503" lengthAdjust="spacingAndGlyphs">questions against the learning goal.</tspan></text></a></g><g class="flow-node" data-node-id="feedback" aria-label="Review the work together. Discuss the result, difficulties, individual contribution and support needed."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#first-task" target="_blank"><title>Review the work together: Discuss the result, difficulties, individual contribution and support needed.</title><rect x="36" y="1683" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1708" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1733" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="193.824" lengthAdjust="spacingAndGlyphs">Review the work together</tspan></text><text x="55" y="1758" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="324.402" lengthAdjust="spacingAndGlyphs">Discuss the result, difficulties, individual contribution and</tspan><tspan x="55" dy="20" textLength="93.951" lengthAdjust="spacingAndGlyphs">support needed.</tspan></text></a></g><g class="flow-node" data-node-id="continue" aria-label="Do both sides want and have the capacity to continue?. Confirm research fit, supervision capacity, task conditions and individual commitments."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#next" target="_blank"><title>Do both sides want and have the capacity to continue?: Confirm research fit, supervision capacity, task conditions and individual commitments.</title><polygon points="240.0,1948 444,2104.0 240.0,2260 36,2104.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="2069.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="220.496" lengthAdjust="spacingAndGlyphs">Do both sides want and have</tspan><tspan x="240.0" dy="22" textLength="192.048" lengthAdjust="spacingAndGlyphs">the capacity to continue?</tspan></text><text x="240.0" y="2117.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="172.044" lengthAdjust="spacingAndGlyphs">Confirm research fit, supervision</tspan><tspan x="240.0" dy="17" textLength="153.408" lengthAdjust="spacingAndGlyphs">capacity, task conditions and</tspan><tspan x="240.0" dy="17" textLength="128.028" lengthAdjust="spacingAndGlyphs">individual commitments.</tspan></text></a></g><g class="flow-node" data-node-id="replan" aria-label="Revise the plan or conclude the collaboration. Record feedback and contributions; discuss a revised plan or finish with a useful summary."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#next" target="_blank"><title>Revise the plan or conclude the collaboration: Record feedback and contributions; discuss a revised plan or finish with a useful summary.</title><rect x="548" y="1948" width="310" height="184" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1973" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="1998" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="212.512" lengthAdjust="spacingAndGlyphs">Revise the plan or conclude</tspan><tspan x="567" dy="22" textLength="128.912" lengthAdjust="spacingAndGlyphs">the collaboration</tspan></text><text x="567" y="2045" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="251.446" lengthAdjust="spacingAndGlyphs">Record feedback and contributions; discuss</tspan><tspan x="567" dy="20" textLength="205.920" lengthAdjust="spacingAndGlyphs">a revised plan or finish with a useful</tspan><tspan x="567" dy="20" textLength="57.057" lengthAdjust="spacingAndGlyphs">summary.</tspan></text></a></g><g class="flow-node" data-node-id="collaborate" aria-label="Confirm collaboration and continue learning. Agree on tasks and supervision; use the joint training guide when visiting, credit or degree procedures apply."><a href="https://csma-graduation-projects.github.io/en/research-collaboration.html#next" target="_blank"><title>Confirm collaboration and continue learning: Agree on tasks and supervision; use the joint training guide when visiting, credit or degree procedures apply.</title><rect x="36" y="2375" width="408" height="164" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2400" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="130.229" lengthAdjust="spacingAndGlyphs">Completion and next steps</tspan></text><text x="55" y="2425" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="270.256" lengthAdjust="spacingAndGlyphs">Confirm collaboration and continue</tspan><tspan x="55" dy="22" textLength="62.240" lengthAdjust="spacingAndGlyphs">learning</tspan></text><text x="55" y="2472" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="340.340" lengthAdjust="spacingAndGlyphs">Agree on tasks and supervision; use the joint training guide</tspan><tspan x="55" dy="20" textLength="279.617" lengthAdjust="spacingAndGlyphs">when visiting, credit or degree procedures apply.</tspan></text></a></g><text x="36" y="2679" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="696.514" lengthAdjust="spacingAndGlyphs">Scope and limits: This is an invitation to discuss collaboration, not a promise of a place, funding or admission. Timing and</tspan><tspan x="36" dy="21" textLength="726.128" lengthAdjust="spacingAndGlyphs">arrangements are agreed individually; pausing or concluding is a valid outcome. Formal procedures apply only where relevant.</tspan></text><text x="36" y="2753" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="534.292" lengthAdjust="spacingAndGlyphs">CSMA Student Guide · https://csma-graduation-projects.github.io/en/workflows.html#flow-research-collaboration</tspan></text></svg>
