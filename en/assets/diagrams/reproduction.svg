<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2632" viewBox="0 0 920 2632" role="img" aria-labelledby="diagram-title diagram-desc" font-family="Arial,Helvetica,sans-serif"><title id="diagram-title">Replication: from environment to evidence</title><desc id="diagram-desc">Distinguish environment checks, offline recalculation, actual execution and research conclusions. Solid arrows move downwards, gold diamonds are decisions, and dashed lines return after correction.Replication does not guarantee identical numerical results. Explain differences in data, configuration or evaluation, and limit claims accordingly. Retain failure and timeout records.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2632" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0" textLength="505.675" lengthAdjust="spacingAndGlyphs">Replication: from environment to evidence</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="599.914" lengthAdjust="spacingAndGlyphs">Distinguish environment checks, offline recalculation, actual execution and research conclusions.</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0" textLength="742.820" lengthAdjust="spacingAndGlyphs">Follow the downward route; unmet conditions lead to the right-hand correction branch, then return along the dashed line. Select a</tspan><tspan x="36" dy="20.150000000000002" textLength="141.635" lengthAdjust="spacingAndGlyphs">node for its online guide.</tspan></text><text x="458" y="808.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="environment-check" data-to="environment-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 852.0 L 543 820.0" /><text x="548" y="931" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="192.698" lengthAdjust="spacingAndGlyphs">↶ Return to environment and small test</tspan></text><path class="flow-edge" data-from="environment-revise" data-to="environment" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 820.0 L 879 820.0 L 879 445 L 422 445 L 422 461" /><text x="458" y="1962.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0" textLength="61.356" lengthAdjust="spacingAndGlyphs">Not yet met</tspan></text><path class="flow-edge" data-from="recheck-check" data-to="recheck-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2007.0 L 543 1974.0" /><text x="548" y="2085" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0" textLength="179.267" lengthAdjust="spacingAndGlyphs">↶ Return to execution and validation</tspan></text><path class="flow-edge" data-from="recheck-revise" data-to="run" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 858 1974.0 L 889 1974.0 L 889 1069 L 422 1069 L 422 1085" /><path class="flow-edge" data-from="target" data-to="environment" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 350 L 240.0 460" /><path class="flow-edge" data-from="environment" data-to="environment-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 615 L 240.0 725" /><text x="254.0" y="1004" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="environment-check" data-to="run" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 974 L 240.0 1084" /><path class="flow-edge" data-from="run" data-to="analysis" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1239 L 240.0 1349" /><path class="flow-edge" data-from="analysis" data-to="recheck" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1504 L 240.0 1614" /><path class="flow-edge" data-from="recheck" data-to="recheck-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1769 L 240.0 1879" /><text x="254.0" y="2160" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0" textLength="103.380" lengthAdjust="spacingAndGlyphs">Continue when met</tspan></text><path class="flow-edge" data-from="recheck-check" data-to="package" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2130 L 240.0 2240" /><g class="flow-node" data-node-id="target" aria-label="Define the replication target and baseline. Identify the paper version, target claim, data license and evaluation definitions."><a href="https://csma-graduation-projects.github.io/en/templates.html#experiment" target="_blank"><title>Define the replication target and baseline: Identify the paper version, target claim, data license and evaluation definitions.</title><rect x="36" y="200" width="408" height="150" rx="9" fill="#ffffff" stroke="#