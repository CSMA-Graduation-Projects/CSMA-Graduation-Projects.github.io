branch</tspan></text><text x="567" y="780" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="138.736" lengthAdjust="spacingAndGlyphs">Revise and review</tspan></text><text x="567" y="805" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="211.731" lengthAdjust="spacingAndGlyphs">Identify dependency, data, access or</tspan><tspan x="567" dy="20" textLength="253.591" lengthAdjust="spacingAndGlyphs">computing-resource issues. Reduce the trial</tspan><tspan x="567" dy="20" textLength="126.464" lengthAdjust="spacingAndGlyphs">if needed and rerun it.</tspan></text></a></g><g class="flow-node" data-node-id="run" aria-label="Run the predefined experiments. Save actual commands, times, exit status, full logs and raw outputs."><a href="https://csma-graduation-projects.github.io/en/master.html#research" target="_blank"><title>Run the predefined experiments: Save actual commands, times, exit status, full logs and raw outputs.</title><rect x="36" y="1089" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1114" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1139" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="244.496" lengthAdjust="spacingAndGlyphs">Run the predefined experiments</tspan></text><text x="55" y="1164" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="340.301" lengthAdjust="spacingAndGlyphs">Save actual commands, times, exit status, full logs and raw</tspan><tspan x="55" dy="20" textLength="46.254" lengthAdjust="spacingAndGlyphs">outputs.</tspan></text></a></g><g class="flow-node" data-node-id="analysis" aria-label="Analyze results and differences. Use the predefined rules for failures, statistical uncertainty and comparison conditions."><a href="https://csma-graduation-projects.github.io/en/integrity.html#integrity-evidence" target="_blank"><title>Analyze results and differences: Use the predefined rules for failures, statistical uncertainty and comparison conditions.</title><rect x="36" y="1354" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1379" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1404" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="240.080" lengthAdjust="spacingAndGlyphs">Analyze results and differences</tspan></text><text x="55" y="1429" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="359.099" lengthAdjust="spacingAndGlyphs">Use the predefined rules for failures, statistical uncertainty and</tspan><tspan x="55" dy="20" textLength="132.938" lengthAdjust="spacingAndGlyphs">comparison conditions.</tspan></text></a></g><g class="flow-node" data-node-id="recheck" aria-label="Check key claims against records. Repeat key steps in the declared environment, or state the exact scope of offline recalculation."><a href="https://csma-graduation-projects.github.io/en/archive.html#reproduce-and-verify" target="_blank"><title>Check key claims against records: Repeat key steps in the declared environment, or state the exact scope of offline recalculation.</title><rect x="36" y="1619" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1644" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="49.511" lengthAdjust="spacingAndGlyphs">Work step</tspan></text><text x="55" y="1669" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="257.008" lengthAdjust="spacingAndGlyphs">Check key claims against records</tspan></text><text x="55" y="1694" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="336.726" lengthAdjust="spacingAndGlyphs">Repeat key steps in the declared environment, or state the</tspan><tspan x="55" dy="20" textLength="202.319" lengthAdjust="spacingAndGlyphs">exact scope of offline recalculation.</tspan></text></a></g><g class="flow-node" data-node-id="recheck-check" aria-label="Does the evidence support the current claims?. Each result is traceable to a specific version and original record."><a href="https://csma-graduation-projects.github.io/en/archive.html#reproduce-and-verify" target="_blank"><title>Does the evidence support the current claims?: Each result is traceable to a specific version and original record.</title><polygon points="240.0,1884 444,2007.0 240.0,2130 36,2007.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1981.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0" textLength="204.496" lengthAdjust="spacingAndGlyphs">Does the evidence support</tspan><tspan x="240.0" dy="22" textLength="146.720" lengthAdjust="spacingAndGlyphs">the current claims?</tspan></text><text x="240.0" y="2029.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0" textLength="191.412" lengthAdjust="spacingAndGlyphs">Each result is traceable to a specific</tspan><tspan x="240.0" dy="17" textLength="144.720" lengthAdjust="spacingAndGlyphs">version and original record.</tspan></text></a></g><g class="flow-node" data-node-id="recheck-revise" aria-label="Revise and review. Investigate differences, add experiments or narrow claims. Do not discard unfavorable cases to obtain a desired result."><a href="https://csma-graduation-projects.github.io/en/templates.html#experiment" target="_blank"><title>Revise and review: Investigate differences, add experiments or narrow claims. Do not discard unfavorable cases to obtain a desired result.</title><rect x="548" y="1884" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1909" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="87.417" lengthAdjust="spacingAndGlyphs">Correction branch</tspan></text><text x="567" y="1934" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0" textLength="138.736" lengthAdjust="spacingAndGlyphs">Revise and review</tspan></text><text x="567" y="1959" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0" textLength="248.560" lengthAdjust="spacingAndGlyphs">Investigate differences, add experiments or</tspan><tspan x="567" dy="20" textLength="242.749" lengthAdjust="spacingAndGlyphs">narrow claims. Do not discard unfavorable</tspan><tspan x="567" dy="20" textLength="183.534" lengthAdjust="spacingAndGlyphs">cases to obtain a desired result.</tspan></text></a></g><g class="flow-node" data-node-id="package" aria-label="Prepare a verifiable experiment package. Include configuration, logs, analysis scripts, README, limitations and licenses."><a href="https://csma-graduation-projects.github.io/en/templates.html#archive" target="_blank"><title>Prepare a verifiable experiment package: Include configuration, logs, analysis scripts, README, limitations and licenses.</title><rect x="36" y="2245" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2270" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0" textLength="130.229" lengthAdjust="spacingAndGlyphs">Completion and next steps</tspan></text><text x="55" y="2295" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0" textLength="305.920" lengthAdjust="spacingAndGlyphs">Prepare a verifiable 