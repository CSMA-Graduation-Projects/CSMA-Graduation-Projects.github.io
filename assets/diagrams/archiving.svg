<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2601" viewBox="0 0 920 2601" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">归档交接：从材料到接收验收</title><desc id="diagram-desc">让接收者真正找到、打开并复查材料，明确保存和访问责任。 实线向下推进，金色菱形为判断，虚线为整改后返回。学位材料提交与研究资料交接分别办理；公开版与受控原件分开，账号权限通过组织批准的方式转移，不要求共享个人账号密码。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2601" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">归档交接：从材料到接收验收</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">让接收者真正找到、打开并复查材料，明确保存和访问责任。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="818.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="access-check" data-to="access-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 829.0 L 543 799.0" /><text x="548" y="910" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回材料与权限清单</tspan></text><path class="flow-edge" data-from="access-revise" data-to="inventory" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 889 L 703.0 916 L 879 916 L 879 159 L 422 159 L 422 175" /><text x="458" y="1703.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="verify-check" data-to="verify-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1714.0 L 543 1684.0" /><text x="548" y="1795" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回补档与恢复说明</tspan></text><path class="flow-edge" data-from="verify-revise" data-to="package" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 1774 L 703.0 1801 L 889 1801 L 889 1044 L 422 1044 L 422 1060" /><path class="flow-edge" data-from="inventory" data-to="access" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><path class="flow-edge" data-from="access" data-to="access-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 594 L 240.0 704" /><text x="254.0" y="979" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="access-check" data-to="package" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 949 L 240.0 1059" /><path class="flow-edge" data-from="package" data-to="verify" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><path class="flow-edge" data-from="verify" data-to="verify-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1479 L 240.0 1589" /><text x="254.0" y="1864" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="verify-check" data-to="handover" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1834 L 240.0 1944" /><path class="flow-edge" data-from="handover" data-to="retain" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2099 L 240.0 2209" /><g class="flow-node" data-node-id="inventory" aria-label="整理材料与版本索引。列出论文、代码、数据、日志、分析、说明、许可及未完事项。"><a href="https://csma-graduation-projects.github.io/templates.html#archive" target="_blank"><title>整理材料与版本索引：列出论文、代码、数据、日志、分析、说明、许可及未完事项。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">整理材料与版本索引</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">列出论文、代码、数据、日志、分析、说明、许可及未完事项。</tspan></text></a></g><g class="flow-node" data-node-id="access" aria-label="核对授权与可见范围。区分公开、组内受控、限制访问，清除公开副本敏感信息。"><a href="https://csma-graduation-projects.github.io/archive.html#visibility-model" target="_blank"><title>核对授权与可见范围：区分公开、组内受控、限制访问，清除公开副本敏感信息。</title><rect x="36" y="444" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">核对授权与可见范围</tspan></text><text x="55" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">区分公开、组内受控、限制访问，清除公开副本敏感信息。</tspan></text></a></g><g class="flow-node" data-node-id="access-check" aria-label="公开和移交权限明确？。可下载或曾接触材料不等于拥有公开权限。"><a href="https://csma-graduation-projects.github.io/archive.html#visibility-model" target="_blank"><title>公开和移交权限明确？：可下载或曾接触材料不等于拥有公开权限。</title><polygon points="240.0,709 444,829.0 240.0,949 36,829.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="814.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">公开和移交权限明确？</tspan></text><text x="240.0" y="840.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">可下载或曾接触材料不等于拥有公开权</tspan><tspan x="240.0" dy="17">限。</tspan></text></a></g><g class="flow-node" data-node-id="access-revise" aria-label="修订与复核。申请授权、脱敏或限制访问；不能公开的内容留在获准位置。"><a href="https://csma-graduation-projects.github.io/templates.html#archive" target="_blank"><title>修订与复核：申请授权、脱敏或限制访问；不能公开的内容留在获准位置。</title><rect x="548" y="709" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="734" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="759" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="784" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">申请授权、脱敏或限制访问；不能公开的内容</tspan><tspan x="567" dy="20">留在获准位置。</tspan></text></a></g><g class="flow-node" data-node-id="package" aria-label="整理归档包与恢复说明。补充数据来源、版本、依赖、命令、校验值、负责人和保存期。"><a href="https://csma-graduation-projects.github.io/archive.html#archive-metadata" target="_blank"><title>整理归档包与恢复说明：补充数据来源、版本、依赖、命令、校验值、负责人和保存期。</title><rect x="36" y="1064" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1089" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1114" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">整理归档包与恢复说明</tspan></text><text x="55" y="1139" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">补充数据来源、版本、依赖、命令、校验值、负责人和保存期。</tspan></text></a></g><g class="flow-node" data-node-id="verify" aria-label="由接收方检查恢复与复现。抽查打开文件，按说明恢复关键材料并复查核心证据。"><a href="https://csma-graduation-projects.github.io/archive.html#reproduce-and-verify" target="_blank"><title>由接收方检查恢复与复现：抽查打开文件，按说明恢复关键材料并复查核心证据。</title><rect x="36" y="1329" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1354" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1379" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">由接收方检查恢复与复现</tspan></text><text x="55" y="1404" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">抽查打开文件，按说明恢复关键材料并复查核心证据。</tspan></text></a></g><g class="flow-node" data-node-id="verify-check" aria-label="材料完整且能够按说明复查？。目录截图、空文件和上传成功均不能替代验收。"><a href="https://csma-graduation-projects.github.io/archive.html#reproduce-and-verify" target="_blank"><title>材料完整且能够按说明复查？：目录截图、空文件和上传成功均不能替代验收。</title><polygon points="240.0,1594 444,1714.0 240.0,1834 36,1714.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1699.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">材料完整且能够按说明复查？</tspan></text><text x="240.0" y="1725.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">目录截图、空文件和上传成功均不能替</tspan><tspan x="240.0" dy="17">代验收。</tspan></text></a></g><g class="flow-node" data-node-id="verify-revise" aria-label="修订与复核。补齐缺档并重新验收；不可恢复项如实写明原因和影响。"><a href="https://csma-graduation-projects.github.io/templates.html#handover" target="_blank"><title>修订与复核：补齐缺档并重新验收；不可恢复项如实写明原因和影响。</title><rect x="548" y="1594" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1619" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1644" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1669" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">补齐缺档并重新验收；不可恢复项如实写明原</tspan><tspan x="567" dy="20">因和影响。</tspan></text></a></g><g class="flow-node" data-node-id="handover" aria-label="确认接收、权限与未完责任。记录接收范围、待办、账号设备处理和后续联系边界。"><a href="https://csma-graduation-projects.github.io/templates.html#handover" target="_blank"><title>确认接收、权限与未完责任：记录接收范围、待办、账号设备处理和后续联系边界。</title><rect x="36" y="1949" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1974" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1999" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">确认接收、权限与未完责任</tspan></text><text x="55" y="2024" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">记录接收范围、待办、账号设备处理和后续联系边界。</tspan></text></a></g><g class="flow-node" data-node-id="retain" aria-label="定期备份与保留期复核。按照许可与单位要求保存、控制访问，并按约定复查可恢复性。"><a href="https://csma-graduation-projects.github.io/archive.html#retention-and-access" target="_blank"><title>定期备份与保留期复核：按照许可与单位要求保存、控制访问，并按约定复查可恢复性。</title><rect x="36" y="2214" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2239" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成与后续</tspan></text><text x="55" y="2264" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">定期备份与保留期复核</tspan></text><text x="55" y="2289" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">按照许可与单位要求保存、控制访问，并按约定复查可恢复性。</tspan></text></a></g><text x="36" y="2504" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：学位材料提交与研究资料交接分别办理；公开版与受控原件分开，账号权限通过组织批准的方式转移，不要求共享个人账</tspan><tspan x="36" dy="21">号密码。</tspan></text><text x="36" y="2578" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">CSMA 培养指南 · https://csma-graduation-projects.github.io/workflows.html#flow-archiving</tspan></text></svg>
