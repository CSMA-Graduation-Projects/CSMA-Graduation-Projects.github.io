<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2580" viewBox="0 0 920 2580" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">工程开发：从需求到可验收交付</title><desc id="diagram-desc">用设计、实现、测试和验收组成闭环，适用于毕设与竞赛作品。 实线向下推进，金色菱形为判断，虚线为整改后返回。按风险和任务规模选择工具；可运行的界面只是局部证据，交付应覆盖核心需求、异常情况和使用边界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2580" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">工程开发：从需求到可验收交付</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">用设计、实现、测试和验收组成闭环，适用于毕设与竞赛作品。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="818.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="design-check" data-to="design-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 829.0 L 543 799.0" /><text x="548" y="910" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回需求与设计</tspan></text><path class="flow-edge" data-from="design-revise" data-to="requirements" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 889 L 703.0 916 L 879 916 L 879 159 L 422 159 L 422 175" /><text x="458" y="1968.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="accept-check" data-to="accept-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1979.0 L 543 1949.0" /><text x="548" y="2060" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回实现与复测</tspan></text><path class="flow-edge" data-from="accept-revise" data-to="implement" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 2039 L 703.0 2066 L 889 2066 L 889 1044 L 422 1044 L 422 1060" /><path class="flow-edge" data-from="requirements" data-to="design" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><path class="flow-edge" data-from="design" data-to="design-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 594 L 240.0 704" /><text x="254.0" y="979" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="design-check" data-to="implement" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 949 L 240.0 1059" /><path class="flow-edge" data-from="implement" data-to="test" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><path class="flow-edge" data-from="test" data-to="accept" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1479 L 240.0 1589" /><path class="flow-edge" data-from="accept" data-to="accept-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1744 L 240.0 1854" /><text x="254.0" y="2129" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="accept-check" data-to="deliver" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2099 L 240.0 2209" /><g class="flow-node" data-node-id="requirements" aria-label="写清需求与验收条件。确认用户场景、范围、个人责任与可测量目标。"><a href="https://csma-graduation-projects.github.io/templates.html#engineering-report" target="_blank"><title>写清需求与验收条件：确认用户场景、范围、个人责任与可测量目标。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">写清需求与验收条件</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">确认用户场景、范围、个人责任与可测量目标。</tspan></text></a></g><g class="flow-node" data-node-id="design" aria-label="详细设计与关键原型。描述接口、数据、异常处理和依赖，先验证高风险环节。"><a href="https://csma-graduation-projects.github.io/bachelor.html#design" target="_blank"><title>详细设计与关键原型：描述接口、数据、异常处理和依赖，先验证高风险环节。</title><rect x="36" y="444" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">详细设计与关键原型</tspan></text><text x="55" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">描述接口、数据、异常处理和依赖，先验证高风险环节。</tspan></text></a></g><g class="flow-node" data-node-id="design-check" aria-label="设计能够满足核心验收条件？。关键依赖与技术路线经过小规模验证。"><a href="https://csma-graduation-projects.github.io/bachelor.html#design" target="_blank"><title>设计能够满足核心验收条件？：关键依赖与技术路线经过小规模验证。</title><polygon points="240.0,709 444,829.0 240.0,949 36,829.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="822.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">设计能够满足核心验收条件？</tspan></text><text x="240.0" y="848.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">关键依赖与技术路线经过小规模验证。</tspan></text></a></g><g class="flow-node" data-node-id="design-revise" aria-label="修订与复核。澄清需求或更换方案；重要范围变更须记录影响并确认。"><a href="https://csma-graduation-projects.github.io/templates.html#change-request" target="_blank"><title>修订与复核：澄清需求或更换方案；重要范围变更须记录影响并确认。</title><rect x="548" y="709" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="734" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="759" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="784" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">澄清需求或更换方案；重要范围变更须记录影</tspan><tspan x="567" dy="20">响并确认。</tspan></text></a></g><g class="flow-node" data-node-id="implement" aria-label="实现最小完整路径。通过版本管理与任务记录逐步扩展，保持运行说明可用。"><a href="https://csma-graduation-projects.github.io/bachelor.html#implementation" target="_blank"><title>实现最小完整路径：通过版本管理与任务记录逐步扩展，保持运行说明可用。</title><rect x="36" y="1064" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1089" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1114" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">实现最小完整路径</tspan></text><text x="55" y="1139" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">通过版本管理与任务记录逐步扩展，保持运行说明可用。</tspan></text></a></g><g class="flow-node" data-node-id="test" aria-label="测试与证据整理。覆盖核心功能、边界与失败场景，记录环境和结果。"><a href="https://csma-graduation-projects.github.io/bachelor.html#validation" target="_blank"><title>测试与证据整理：覆盖核心功能、边界与失败场景，记录环境和结果。</title><rect x="36" y="1329" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1354" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1379" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">测试与证据整理</tspan></text><text x="55" y="1404" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">覆盖核心功能、边界与失败场景，记录环境和结果。</tspan></text></a></g><g class="flow-node" data-node-id="accept" aria-label="按需求演示与验收。使用待交付版本复查，说明已实现范围、缺陷与限制。"><a href="https://csma-graduation-projects.github.io/templates.html#engineering-report" target="_blank"><title>按需求演示与验收：使用待交付版本复查，说明已实现范围、缺陷与限制。</title><rect x="36" y="1594" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1619" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1644" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">按需求演示与验收</tspan></text><text x="55" y="1669" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">使用待交付版本复查，说明已实现范围、缺陷与限制。</tspan></text></a></g><g class="flow-node" data-node-id="accept-check" aria-label="核心目标通过验收？。没有将未来计划写成已实现功能。"><a href="https://csma-graduation-projects.github.io/templates.html#engineering-report" target="_blank"><title>核心目标通过验收？：没有将未来计划写成已实现功能。</title><polygon points="240.0,1859 444,1979.0 240.0,2099 36,1979.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1972.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">核心目标通过验收？</tspan></text><text x="240.0" y="1998.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">没有将未来计划写成已实现功能。</tspan></text></a></g><g class="flow-node" data-node-id="accept-revise" aria-label="修订与复核。修复缺陷并复测；无法达到时调整范围与说明后重新确认。"><a href="https://csma-graduation-projects.github.io/templates.html#engineering-report" target="_blank"><title>修订与复核：修复缺陷并复测；无法达到时调整范围与说明后重新确认。</title><rect x="548" y="1859" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1884" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1909" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1934" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">修复缺陷并复测；无法达到时调整范围与说明</tspan><tspan x="567" dy="20">后重新确认。</tspan></text></a></g><g class="flow-node" data-node-id="deliver" aria-label="发布或交接已确认版本。确认公开授权、依赖许可、回退办法与接收记录。"><a href="https://csma-graduation-projects.github.io/templates.html#handover" target="_blank"><title>发布或交接已确认版本：确认公开授权、依赖许可、回退办法与接收记录。</title><rect x="36" y="2214" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2239" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成与后续</tspan></text><text x="55" y="2264" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">发布或交接已确认版本</tspan></text><text x="55" y="2289" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">确认公开授权、依赖许可、回退办法与接收记录。</tspan></text></a></g><text x="36" y="2504" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：按风险和任务规模选择工具；可运行的界面只是局部证据，交付应覆盖核心需求、异常情况和使用边界。</tspan></text><text x="36" y="2557" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">CSMA 培养指南 · https://csma-graduation-projects.github.io/workflows.html#flow-engineering</tspan></text></svg>
