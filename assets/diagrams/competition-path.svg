<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2956" viewBox="0 0 920 2956" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">学科竞赛与创新实践流程图</title><desc id="diagram-desc">主线覆盖全部 6 个阶段；判断节点给出继续条件，侧支路说明未满足时回到哪里。 实线向下推进，金色菱形为判断，虚线为整改后返回。报名按官方窗口独立倒排，可与原型开发并行或按赛规调整先后，不等待内部流程而错过截止。每项受资格或审批限制的活动仍须满足正式条件。图示为工作导航，最终资格与成绩以官方结论为准。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2956" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">学科竞赛与创新实践流程图</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">主线覆盖全部 6 个阶段；判断节点给出继续条件，侧支路说明未满足时回到哪里。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="553.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="selection-check" data-to="selection-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 564.0 L 543 534.0" /><text x="548" y="645" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回规则核验</tspan></text><path class="flow-edge" data-from="selection-revise" data-to="selection" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0