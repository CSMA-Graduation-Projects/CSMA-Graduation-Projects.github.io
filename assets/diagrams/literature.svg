l#reading" target="_blank"><title>精读与原文核验：核对方法、数据、评价口径、局限与相反证据，追溯引用。</title><rect x="36" y="709" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="734" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="759" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">精读与原文核验</tspan></text><text x="55" y="784" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">核对方法、数据、评价口径、局限与相反证据，追溯引用。</tspan></text></a></g><g class="flow-node" data-node-id="read-check" aria-label="关键证据已覆盖且可核验？。检查代表性工作与反证，不以条目数量代替质量。"><a href="https://csma-graduation-projects.github.io/templates.html#reading" target="_blank"><title>关键证据已覆盖且可核验？：检查代表性工作与反证，不以条目数量代替质量。</title><polygon points="240.0,974 444,1094.0 240.0,1214 36,1094.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1079.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">关键证据已覆盖且可核验？</tspan></text><text x="240.0" y="1105.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">检查代表性工作与反证，不以条目数量</tspan><tspan x="240.0" dy="17">代替质量。</tspan></text></a></g><g class="flow-node" data-node-id="read-revise" aria-label="修订与复核。补检索、追溯原文或标记不可核验；不引用虚构条目。"><a href="https://csma-graduation-projects.github.io/templates.html#literature" target="_blank"><title>修订与复核：补检索、追溯原文或标记不可核验；不引用虚构条目。</title><rect x="548" y="974" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="999" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1024" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1049" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="