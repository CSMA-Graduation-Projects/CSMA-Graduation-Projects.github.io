4e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">问题仍有研究价值？</tspan></text><text x="240.0" y="1990.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">差异真实存在，范围与资源可支撑验证</tspan><tspan x="240.0" dy="17">。</tspan></text></a></g><g class="flow-node" data-node-id="position-revise" aria-label="修订与复核。缩小问题、调整方向或停止该候选题，保留判断依据。"><a href="https://csma-graduation-projects.github.io/templates.html#topic" target="_blank"><title>修订与复核：缩小问题、调整方向或停止该候选题，保留判断依据。</title><rect x="548" y="1859" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1884" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1909" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1934" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">缩小问题、调整方向或停止该候选题，保留判</tspan><tspan x="567" dy="20">断依据。</tspan></text></a></g><g class="flow-node" data-node-id="maintain" aria-label="持续更新文献库。保存文献元数据、阅读笔记和定位变更依据。"><a href="https://csma-graduation-projects.github.io/archive.html#archive-metadata" target="_blank"><title>持续更新文献库：保存文献元数据、阅读笔记和定位变更依据。</title><rect x="36" y="2214" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2239" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成与后续</tspan></text><text x="55" y="2264" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">持续更新文献库</tspan></text><text x="55" y="2289" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">保存文献元数据、阅读笔记和定位变更依据。</tspan></text></a></g><text x="36" y="2504" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：文献中的结果、本地复现结果与待验证假设分别记录；发现问题已被解决，应调整问题而不是只替换术语。<