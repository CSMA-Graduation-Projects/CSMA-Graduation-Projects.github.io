<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2580" viewBox="0 0 920 2580" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">文献调研：从检索到研究定位</title><desc id="diagram-desc">把检索记录、原文核验、比较矩阵与选题决定连接起来。 实线向下推进，金色菱形为判断，虚线为整改后返回。文献中的结果、本地复现结果与待验证假设分别记录；发现问题已被解决，应调整问题而不是只替换术语。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2580" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">文献调研：从检索到研究定位</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">把检索记录、原文核验、比较矩阵与选题决定连接起来。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="1083.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="read-check" data-to="read-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1094.0 L 543 1064.0" /><text x="548" y="1175" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回检索与筛选</tspan></text><path class="flow-edge" data-from="read-revise" data-to="search" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 1154 L 703.0 1181 L 879 1181 L 879 424 L 422 424 L 422 440" /><text x="458" 