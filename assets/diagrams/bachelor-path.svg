<svg xmlns="http://www.w3.org/2000/svg" width="920" height="3486" viewBox="0 0 920 3486" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">本科毕业设计流程图</title><desc id="diagram-desc">主线覆盖全部 8 个阶段；判断节点给出继续条件，侧支路说明未满足时回到哪里。 实线向下推进，金色菱形为判断，虚线为整改后返回。这是培养工作导航。学习、研究和写作可交叉推进；正式审批、成果认定与学位授予以本人适用制度和学校结论为准。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="3486" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">本科毕业设计流程图</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">主线覆盖全部 8 个阶段；判断节点给出继续条件，侧支路说明未满足时回到哪里。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="818.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="proposal-check" data-to="proposal-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 829.0 L 543 799.0" /><text x="548" y="910" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回开题与重审</tspan></text><path class="flow-edge" data-from="proposal-revise" data-to="proposal" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 889 L 703.0 916 L 879 916 L 879 424 L 422 424 L 422 440" /><text x="458" y="1703.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="implementation-check" data-to="implementation-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1714.0 L 543 1684.0" /><text x="548" y="1795" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回设计与实现</tspan></text><path class="flow-edge" data-from="implementation-revise" data-to="design" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 1774 L 703.0 1801 L 889 1801 L 889 1044 L 422 1044 L 422 1060" /><text x="458" y="2853.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="defense-check" data-to="defense-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2864.0 L 543 2834.0" /><text x="548" y="2945" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回论文整改与申请</tspan></text><path class="flow-edge" data-from="defense-revise" data-to="writing" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 2924 L 703.0 2951 L 874 2951 L 874 2194 L 422 2194 L 422 2210" /><path class="flow-edge" data-from="topic" data-to="proposal" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><path class="flow-edge" data-from="proposal" data-to="proposal-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 594 L 240.0 704" /><text x="254.0" y="979" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="proposal-check" data-to="design" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 949 L 240.0 1059" /><path class="flow-edge" data-from="design" data-to="implementation" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><path class="flow-edge" data-from="implementation" data-to="implementation-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1479 L 240.0 1589" /><text x="254.0" y="1864" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="implementation-check" data-to="validation" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1834 L 240.0 1944" /><path class="flow-edge" data-from="validation" data-to="writing" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2099 L 240.0 2209" /><path class="flow-edge" data-from="writing" data-to="defense" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2364 L 240.0 2474" /><path class="flow-edge" data-from="defense" data-to="defense-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2629 L 240.0 2739" /><text x="254.0" y="3014" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="defense-check" data-to="archive" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2984 L 240.0 3094" /><g class="flow-node" data-node-id="topic" aria-label="核对要求、选题与任务书。核对正式要求，确定范围和个人任务。"><a href="https://csma-graduation-projects.github.io/bachelor.html#topic" target="_blank"><title>核对要求、选题与任务书：核对正式要求，确定范围和个人任务。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">核对要求、选题与任务书</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">核对正式要求，确定范围和个人任务。</tspan></text></a></g><g class="flow-node" data-node-id="proposal" aria-label="文献调研与开题。形成综述、研究问题、方案与开题材料。"><a href="https://csma-graduation-projects.github.io/bachelor.html#proposal" target="_blank"><title>文献调研与开题：形成综述、研究问题、方案与开题材料。</title><rect x="36" y="444" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">文献调研与开题</tspan></text><text x="55" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">形成综述、研究问题、方案与开题材料。</tspan></text></a></g><g class="flow-node" data-node-id="proposal-check" aria-label="正式开题满足要求？。以学院正式结论和整改要求为准。"><a href="https://csma-graduation-projects.github.io/bachelor.html#proposal" target="_blank"><title>正式开题满足要求？：以学院正式结论和整改要求为准。</title><polygon points="240.0,709 444,829.0 240.0,949 36,829.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="822.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">正式开题满足要求？</tspan></text><text x="240.0" y="848.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">以学院正式结论和整改要求为准。</tspan></text></a></g><g class="flow-node" data-node-i