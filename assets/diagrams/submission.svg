<svg xmlns="http://www.w3.org/2000/svg" width="920" height="3221" viewBox="0 0 920 3221" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">论文提交：检查、评阅与答辩</title><desc id="diagram-desc">把文件版本、正式检查、送审意见和学位手续连在一起。 实线向下推进，金色菱形为判断，虚线为整改后返回。学校是否设置预答辩、查非及其具体顺序各不相同，应先核对适用制度；论文检查、评阅、答辩与学位授予是不同状态。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="3221" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">论文提交：检查、评阅与答辩</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">把文件版本、正式检查、送审意见和学位手续连在一起。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="1083.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="checks-check" data-to="checks-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1094.0 L 543 1064.0" /><text x="548" y="1175" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回论文与检查</tspan></text><path class="flow-edge" data-from="checks-revise" data-to="draft" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 1154 L 703.0 1181 L 879 1181 L 879 424 L 422 424 L 422 440" /><text x="458" y="1703.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="review-check" data-to="review-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1714.0 L 543 1684.0" /><text x="548" y="1795" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回修改与正式复审</tspan></text><path class="flow-edge" data-from="review-revise" data-to="draft" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 1774 L 703.0 1801 L 889 1801 L 889 424 L 422 424 L 422 440" /><text x="458" y="2323.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="defense-check" data-to="defense-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2334.0 L 543 2304.0" /><text x="548" y="2415" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回整改与后续申请</tspan></text><path class="flow-edge" data-from="defense-revise" data-to="draft" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 2394 L 703.0 2421 L 874 2421 L 874 424 L 422 424 L 422 440" /><path class="flow-edge" data-from="rules" data-to="draft" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><path class="flow-edge" data-from="draft" data-to="checks" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 594 L 240.0 704" /><path class="flow-edge" data-from="checks" data-to="checks-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 859 L 240.0 969" /><text x="254.0" y="1244" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="checks-check" data-to="review" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><path class="flow-edge" data-from="review" data-to="review-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1479 L 240.0 1589" /><text x="254.0" y="1864" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="review-check" data-to="defense" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1834 L 240.0 1944" /><path class="flow-edge" data-from="defense" data-to="defense-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2099 L 240.0 2209" /><text x="254.0" y="2484" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="defense-check" data-to="final" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2454 L 240.0 2564" /><path class="flow-edge" data-from="final" data-to="archive" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2719 L 240.0 2829" /><g class="flow-node" data-node-id="rules" aria-label="核对资格、窗口与正式程序。确认培养成果、预答辩安排、平台、模板和截止日期。"><a href="https://csma-graduation-projects.github.io/policies.html#local-check" target="_blank"><title>核对资格、窗口与正式程序：确认培养成果、预答辩安排、平台、模板和截止日期。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">核对资格、窗口与正式程序</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">确认培养成果、预答辩安排、平台、模板和截止日期。</tspan></text></a></g><g class="flow-node" data-node-id="draft" aria-label="完成论文与导师审阅。将研究结论、引用、图表和附件对应到真实证据。"><a href="https://csma-graduation-projects.github.io/master.html#writing" target="_blank"><title>完成论文与导师审阅：将研究结论、引用、图表和附件对应到真实证据。</title><rect x="36" y="444" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">完成论文与导师审阅</tspan></text><text x="55" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">将研究结论、引用、图表和附件对应到真实证据。</tspan></text></a></g><g class="flow-node" data-node-id="checks" aria-label="分别完成规定检查。查重、查非与 AI 使用说明分别处理，报告绑定同一版本。"><a href="https://csma-graduation-projects.github.io/master.html#integrity" target="_blank"><title>分别完成规定检查：查重、查非与 AI 使用说明分别处理，报告绑定同一版本。</title><rect x="36" y="709" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="734" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="759" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">分别完成规定检查</tspan></text><text x="55" y="784" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">查重、查非与 AI 使用说明分别处理，报告绑定同一版本。</tspan></text></a></g><g class="flow-node" data-node-id="checks-check" aria-label="申请条件与各项检查均满足？。采用学校指定判定口径，不自设统一阈值。"><a href="https://csma-graduation-projects.github.io/master.html#integrity" target="_blank"><title>申请条件与各项检查均满足？：采用学校指定判定口径，不自设统一阈值。</title><polygon points="240.0,974 444,1094.0 240.0,1214 36,1094.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1079.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">申请条件与各项检查均满足？</tspan></text><text x="240.0" y="1105.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">采用学校指定判定口径，不自设统一阈</tspan><tspan x="240.0" dy="17">值。</tspan></text></a></g><g class="flow-node" data-node-id="checks-revise" aria-label="修订与复核。核实原因并修改、复检或申请复核；实质修改核对重检要求。"><a href="https://csma-graduation-projects.github.io/templates.html#integrity" target="_blank"><title>修订与复核：核实原因并修改、复检或申请复核；实质修改核对重检要求。</title><rect x="548" y="974" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="999" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1024" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1049" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">核实原因并修改、复检或申请复核；实质修改</tspan><tspan x="567" dy="20">核对重检要求。</tspan></text></a></g><g class="flow-node" data-node-id="review" aria-label="按要求匿名送审并接收意见。核对正文、属性、附件与链接；保存版本校验值和回执。"><a href="https://csma-graduation-projects.github.io/master.html#review" target="_blank"><title>按要求匿名送审并接收意见：核对正文、属性、附件与链接；保存版本校验值和回执。</title><rect x="36" y="1329" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1354" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1379" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">按要求匿名送审并接收意见</tspan></text><text x="55" y="1404" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">核对正文、属性、附件与链接；保存版本校验值和回执。</tspan></text></a></g><g class="flow-node" data-node-id="review-check" aria-label="正式取得答辩资格？。按评阅、复审或异议处理的正式结论执行。"><a href="https://csma-graduation-projects.github.io/master.html#review" target="_blank"><title>正式取得答辩资格？：按评阅、复审或异议处理的正式结论执行。</title><polygon points="240.0,1594 444,1714.0 240.0,1834 36,1714.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1699.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">正式取得答辩资格？</tspan></text><text x="240.0" y="1725.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">按评阅、复审或异议处理的正式结论执</tspan><tspan x="240.0" dy="17">行。</tspan></text></a></g><g class="flow-node" data-node-id="review-revise" aria-label="修订与复核。逐条处理意见，按规定复审或延期；不得自行宣布通过。"><a href="https://csma-graduation-projects.github.io/templates.html#review-response" target="_blank"><title>修订与复核：逐条处理意见，按规定复审或延期；不得自行宣布通过。</title><rect x="548" y="1594" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1619" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1644" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1669" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">逐条处理意见，按规定复审或延期；不得自行</tspan><tspan x="567" dy="20">宣布通过。</tspan></text></a></g><g class="flow-node" data-node-id="defense" aria-label="申请并参加正式答辩。按正式资格、委员会安排和通知提交材料、汇报与答询。"><a href="https://csma-graduation-projects.github.io/master.html#defense" target="_blank"><title>申请并参加正式答辩：按正式资格、委员会安排和通知提交材料、汇报与答询。</title><rect x="36" y="1949" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1974" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1999" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">申请并参加正式答辩</tspan></text><text x="55" y="2024" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">按正式资格、委员会安排和通知提交材料、汇报与答询。</tspan></text></a></g><g class="flow-node" data-node-id="defense-check" aria-label="正式结论允许后续定稿？。修改后通过仍须落实对应条件。"><a href="https://csma-graduation-projects.github.io/master.html#defense" target="_blank"><title>正式结论允许后续定稿？：修改后通过仍须落实对应条件。</title><polygon points="240.0,2214 444,2334.0 240.0,2454 36,2334.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="2327.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">正式结论允许后续定稿？</tspan></text><text x="240.0" y="2353.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">修改后通过仍须落实对应条件。</tspan></text></a></g><g class="flow-node" data-node-id="defense-revise" aria-label="修订与复核。依规定整改、复查或再次申请，不承诺再次答辩结果。"><a href="https://csma-graduation-projects.github.io/templates.html#review-response" target="_blank"><title>修订与复核：依规定整改、复查或再次申请，不承诺再次答辩结果。</title><rect x="548" y="2214" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="2239" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="2264" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="2289" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">依规定整改、复查或再次申请，不承诺再次答</tspan><tspan x="567" dy="20">辩结果。</tspan></text></a></g><g class="flow-node" data-node-id="final" aria-label="修改定稿与学位手续。落实意见、签字与接收，学位状态以学校正式决定为准。"><a href="https://csma-graduation-projects.github.io/master.html#final" target="_blank"><title>修改定稿与学位手续：落实意见、签字与接收，学位状态以学校正式决定为准。</title><rect x="36" y="2569" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2594" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="2619" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">修改定稿与学位手续</tspan></text><text x="55" y="2644" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">落实意见、签字与接收，学位状态以学校正式决定为准。</tspan></text></a></g><g class="flow-node" data-node-id="archive" aria-label="分别完成学位材料与研究归档。确认学校提交与研究资料接收，保护未公开和敏感材料。"><a href="https://csma-graduation-projects.github.io/archive.html" target="_blank"><title>分别完成学位材料与研究归档：确认学校提交与研究资料接收，保护未公开和敏感材料。</title><rect x="36" y="2834" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2859" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成与后续</tspan></text><text x="55" y="2884" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">分别完成学位材料与研究归档</tspan></text><text x="55" y="2909" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">确认学校提交与研究资料接收，保护未公开和敏感材料。</tspan></text></a></g><text x="36" y="3124" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：学校是否设置预答辩、查非及其具体顺序各不相同，应先核对适用制度；论文检查、评阅、答辩与学位授予是不同状态。</tspan></text><text x="36" y="3198" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">CSMA 培养指南 · https://csma-graduation-projects.github.io/workflows.html#flow-submission</tspan></text></svg>
