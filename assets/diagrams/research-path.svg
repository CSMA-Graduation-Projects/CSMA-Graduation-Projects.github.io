<svg xmlns="http://www.w3.org/2000/svg" width="920" height="3221" viewBox="0 0 920 3221" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">本科科研训练流程图</title><desc id="diagram-desc">主线覆盖全部 7 个阶段；判断节点给出继续条件，侧支路说明未满足时回到哪里。 实线向下推进，金色菱形为判断，虚线为整改后返回。这是培养工作导航。学习、研究和写作可交叉推进；正式审批、成果认定与学位授予以本人适用制度和学校结论为准。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="3221" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">本科科研训练流程图</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">主线覆盖全部 7 个阶段；判断节点给出继续条件，侧支路说明未满足时回到哪里。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="553.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="orientation-check" data-to="orientation-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 564.0 L 543 534.0" /><text x="548" y="645" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回匹配与约定</tspan></text><path class="flow-edge" data-from="orientation-revise" data-to="orientation" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 624 L 703.0 651 L 879 651 L 879 159 L 422 159 L 422 175" /><text x="458" y="1438.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="exploration-check" data-to="exploration-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1449.0 L 543 1419.0" /><text x="548" y="1530" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回阅读与小验证</tspan></text><path class="flow-edge" data-from="exploration-revise" data-to="exploration" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 1509 L 703.0 1536 L 889 1536 L 889 1044 L 422 1044 L 422 1060" /><text x="458" y="2588.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="validation-check" data-to="validation-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2599.0 L 543 2569.0" /><text x="548" y="2680" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回实施与补证据</tspan></text><path class="flow-edge" data-from="validation-revise" data-to="execution" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 2659 L 703.0 2686 L 874 2686 L 874 1929 L 422 1929 L 422 1945" /><path class="flow-edge" data-from="orientation" data-to="orientation-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><text x="254.0" y="714" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="orientation-check" data-to="foundation" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 684 L 240.0 794" /><path class="flow-edge" data-from="foundation" data-to="exploration" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 949 L 240.0 1059" /><path class="flow-edge" data-from="exploration" data-to="exploration-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><text x="254.0" y="1599" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="exploration-check" data-to="project" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1569 L 240.0 1679" /><path class="flow-edge" data-from="project" data-to="execution" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1834 L 240.0 1944" /><path class="flow-edge" data-from="execution" data-to="validation" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2099 L 240.0 2209" /><path class="flow-edge" data-from="validation" data-to="validation-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2364 L 240.0 2474" /><text x="254.0" y="2749" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="validation-check" data-to="archive" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2719 L 240.0 2829" /><g class="flow-node" data-node-id="orientation" aria-label="了解方向与双向匹配。确认目标、时间、资源与沟通约定。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#orientation" target="_blank"><title>了解方向与双向匹配：确认目标、时间、资源与沟通约定。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">了解方向与双向匹配</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">确认目标、时间、资源与沟通约定。</tspan></text></a></g><g class="flow-node" data-node-id="orientation-check" aria-label="任务与时间匹配？。双方确认任务范围与检查日期。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#orientation" target="_blank"><title>任务与时间匹配？：双方确认任务范围与检查日期。</title><polygon points="240.0,444 444,564.0 240.0,684 36,564.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="557.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">任务与时间匹配？</tspan></text><text x="240.0" y="583.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">双方确认任务范围与检查日期。</tspan></text></a></g><g class="flow-node" data-node-id="orientation-revise" aria-label="修订与复核。缩小任务、补足基础或调整时间；不适合时可暂停或退出训练。"><a href="https://csma-graduation-projects.github.io/templates.html#onboarding" target="_blank"><title>修订与复核：缩小任务、补足基础或调整时间；不适合时可暂停或退出训练。</title><rect x="548" y="444" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">缩小任务、补足基础或调整时间；不适合时可</tspan><tspan x="567" dy="20">暂停或退出训练。</tspan></text></a></g><g class="flow-node" data-node-id="foundation" aria-label="工具、文献与规范入门。建立环境、阅读记录和真实证据习惯。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#foundation" target="_blank"><title>工具、文献与规范入门：建立环境、阅读记录和真实证据习惯。</title><rect x="36" y="799" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="824" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="849" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">工具、文献与规范入门</tspan></text><text x="55" y="874" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">建立环境、阅读记录和真实证据习惯。</tspan></text></a></g><g class="flow-node" data-node-id="exploration" aria-label="阅读、复现与小任务验证。小规模阅读、复现，检验问题是否值得研究。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#exploration" target="_blank"><title>阅读、复现与小任务验证：小规模阅读、复现，检验问题是否值得研究。</title><rect x="36" y="1064" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1089" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="1114" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">阅读、复现与小任务验证</tspan></text><text x="55" y="1139" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">小规模阅读、复现，检验问题是否值得研究。</tspan></text></a></g><g class="flow-node" data-node-id="exploration-check" aria-label="证据支持继续投入？。能解释复现结果、价值与资源条件。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#exploration" target="_blank"><title>证据支持继续投入？：能解释复现结果、价值与资源条件。</title><polygon points="240.0,1329 444,1449.0 240.0,1569 36,1449.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1442.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">证据支持继续投入？</tspan></text><text x="240.0" y="1468.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">能解释复现结果、价值与资源条件。</tspan></text></a></g><g class="flow-node" data-node-id="exploration-revise" aria-label="修订与复核。先排查数据与环境；价值不足则换题或结束并保留否定结果。"><a href="https://csma-graduation-projects.github.io/templates.html#experiment" target="_blank"><title>修订与复核：先排查数据与环境；价值不足则换题或结束并保留否定结果。</title><rect x="548" y="1329" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1354" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1379" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1404" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">先排查数据与环境；价值不足则换题或结束并</tspan><tspan x="567" dy="20">保留否定结果。</tspan></text></a></g><g class="flow-node" data-node-id="project" aria-label="项目立项与任务拆分。明确里程碑、分工与可验收产物。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#project" target="_blank"><title>项目立项与任务拆分：明确里程碑、分工与可验收产物。</title><rect x="36" y="1684" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1709" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="1734" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">项目立项与任务拆分</tspan></text><text x="55" y="1759" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">明确里程碑、分工与可验收产物。</tspan></text></a></g><g class="flow-node" data-node-id="execution" aria-label="实施、周报与阶段复核。保留版本与日志，用反馈推动下一轮任务。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#execution" target="_blank"><title>实施、周报与阶段复核：保留版本与日志，用反馈推动下一轮任务。</title><rect x="36" y="1949" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1974" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="1999" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">实施、周报与阶段复核</tspan></text><text x="55" y="2024" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">保留版本与日志，用反馈推动下一轮任务。</tspan></text></a></g><g class="flow-node" data-node-id="validation" aria-label="结果复核与成果表达。检查结论、贡献、引用和公开授权。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#validation" target="_blank"><title>结果复核与成果表达：检查结论、贡献、引用和公开授权。</title><rect x="36" y="2214" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2239" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="2264" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">结果复核与成果表达</tspan></text><text x="55" y="2289" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">检查结论、贡献、引用和公开授权。</tspan></text></a></g><g class="flow-node" data-node-id="validation-check" aria-label="结果能够复查？。主要结论与真实记录相符，使用权限清楚。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#validation" target="_blank"><title>结果能够复查？：主要结论与真实记录相符，使用权限清楚。</title><polygon points="240.0,2479 444,2599.0 240.0,2719 36,2599.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="2584.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">结果能够复查？</tspan></text><text x="240.0" y="2610.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">主要结论与真实记录相符，使用权限清</tspan><tspan x="240.0" dy="17">楚。</tspan></text></a></g><g class="flow-node" data-node-id="validation-revise" aria-label="修订与复核。补实验或收窄结论；授权不清的材料暂不公开，复核后再结项。"><a href="https://csma-graduation-projects.github.io/templates.html#experiment" target="_blank"><title>修订与复核：补实验或收窄结论；授权不清的材料暂不公开，复核后再结项。</title><rect x="548" y="2479" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="2504" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="2529" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="2554" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">补实验或收窄结论；授权不清的材料暂不公开</tspan><tspan x="567" dy="20">，复核后再结项。</tspan></text></a></g><g class="flow-node" data-node-id="archive" aria-label="结项、归档与后续发展。完成接收验收、复盘和后续安排。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#archive" target="_blank"><title>结项、归档与后续发展：完成接收验收、复盘和后续安排。</title><rect x="36" y="2834" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2859" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">培养阶段</tspan></text><text x="55" y="2884" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">结项、归档与后续发展</tspan></text><text x="55" y="2909" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成接收验收、复盘和后续安排。</tspan></text></a></g><text x="36" y="3124" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：这是培养工作导航。学习、研究和写作可交叉推进；正式审批、成果认定与学位授予以本人适用制度和学校结论为准。</tspan></text><text x="36" y="3198" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">CSMA 培养指南 · https://csma-graduation-projects.github.io/workflows.html#flow-research-path</tspan></text></svg>
