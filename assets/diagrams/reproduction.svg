<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2580" viewBox="0 0 920 2580" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">实验复现：从环境到证据</title><desc id="diagram-desc">区分环境预检、离线重算、真实运行与研究结论。 实线向下推进，金色菱形为判断，虚线为整改后返回。复现不承诺与原文数值完全一致。数据、配置和评价口径不同，应解释差异并限制结论；保留失败与超时记录。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2580" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">实验复现：从环境到证据</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">区分环境预检、离线重算、真实运行与研究结论。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="818.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="environment-check" data-to="environment-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 829.0 L 543 799.0" /><text x="548" y="910" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回环境与最小运行</tspan></text><path class="flow-edge" data-from="environment-revise" data-to="environment" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 889 L 703.0 916 L 879 916 L 879 424 L 422 424 L 422 440" /><text x="458" y="1968.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="recheck-check" data-to="recheck-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1979.0 L 543 1949.0" /><text x="548" y="2060" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回执行与补验证</tspan></text><path class="flow-edge" data-from="recheck-revise" data-to="run" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 2039 L 703.0 2066 L 889 2066 L 889 1044 L 422 1044 L 422 1060" /><path class="flow-edge" data-from="target" data-to="environment" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><path class="flow-edge" data-from="environment" data-to="environment-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 594 L 240.0 704" /><text x="254.0" y="979" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="environment-check" data-to="run" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 949 L 240.0 1059" /><path class="flow-edge" data-from="run" data-to="analysis" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><path class="flow-edge" data-from="analysis" data-to="recheck" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1479 L 240.0 1589" /><path class="flow-edge" data-from="recheck" data-to="recheck-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1744 L 240.0 1854" /><text x="254.0" y="2129" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="recheck-check" data-to="package" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2099 L 240.0 2209" /><g class="flow-node" data-node-id="target" aria-label="确定复现目标与原始基线。明确论文版本、目标结论、数据许可与评价口径。"><a href="https://csma-graduation-projects.github.io/templates.html#experiment" target="_blank"><title>确定复现目标与原始基线：明确论文版本、目标结论、数据许可与评价口径。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">确定复现目标与原始基线</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">明确论文版本、目标结论、数据许可与评价口径。</tspan></text></a></g><g class="flow-node" data-node-id="environment" aria-label="冻结环境与最小运行。记录代码版本、依赖、硬件、数据划分、配置和启动命令。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#foundation" target="_blank"><title>冻结环境与最小运行：记录代码版本、依赖、硬件、数据划分、配置和启动命令。</title><rect x="36" y="444" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">冻结环境与最小运行</tspan></text><text x="55" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">记录代码版本、依赖、硬件、数据划分、配置和启动命令。</tspan></text></a></g><g class="flow-node" data-node-id="environment-check" aria-label="最小运行及资源条件满足？。安装成功不等于真实实验已完成。"><a href="https://csma-graduation-projects.github.io/undergraduate-research.html#foundation" target="_blank"><title>最小运行及资源条件满足？：安装成功不等于真实实验已完成。</title><polygon points="240.0,709 444,829.0 240.0,949 36,829.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="822.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">最小运行及资源条件满足？</tspan></text><text x="240.0" y="848.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">安装成功不等于真实实验已完成。</tspan></text></a></g><g class="flow-node" data-node-id="environment-revise" aria-label="修订与复核。定位依赖、数据、权限或算力问题；缩减试验后复跑。"><a href="https://csma-graduation-projects.github.io/templates.html#experiment" target="_blank"><title>修订与复核：定位依赖、数据、权限或算力问题；缩减试验后复跑。</title><rect x="548" y="709" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="734" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="759" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="784" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">定位依赖、数据、权限或算力问题；缩减试验</tspan><tspan x="567" dy="20">后复跑。</tspan></text></a></g><g class="flow-node" data-node-id="run" aria-label="执行预先确定的实验。保存真实命令、时间、退出状态、完整日志和原始输出。"><a href="https://csma-graduation-projects.github.io/master.html#research" target="_blank"><title>执行预先确定的实验：保存真实命令、时间、退出状态、完整日志和原始输出。</title><rect x="36" y="1064" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1089" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1114" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">执行预先确定的实验</tspan></text><text x="55" y="1139" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">保存真实命令、时间、退出状态、完整日志和原始输出。</tspan></text></a></g><g class="flow-node" data-node-id="analysis" aria-label="分析结果与差异。按事先规则处理失败、统计不确定性和比较条件。"><a href="https://csma-graduation-projects.github.io/integrity.html#integrity-evidence" target="_blank"><title>分析结果与差异：按事先规则处理失败、统计不确定性和比较条件。</title><rect x="36" y="1329" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1354" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1379" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">分析结果与差异</tspan></text><text x="55" y="1404" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">按事先规则处理失败、统计不确定性和比较条件。</tspan></text></a></g><g class="flow-node" data-node-id="recheck" aria-label="由记录复查关键结论。在声明的环境重新执行关键步骤或明确离线复算范围。"><a href="https://csma-graduation-projects.github.io/archive.html#reproduce-and-verify" target="_blank"><title>由记录复查关键结论：在声明的环境重新执行关键步骤或明确离线复算范围。</title><rect x="36" y="1594" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1619" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1644" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">由记录复查关键结论</tspan></text><text x="55" y="1669" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">在声明的环境重新执行关键步骤或明确离线复算范围。</tspan></text></a></g><g class="flow-node" data-node-id="recheck-check" aria-label="证据足以支持当前结论？。结果能够定位到具体版本和原始记录。"><a href="https://csma-graduation-projects.github.io/archive.html#reproduce-and-verify" target="_blank"><title>证据足以支持当前结论？：结果能够定位到具体版本和原始记录。</title><polygon points="240.0,1859 444,1979.0 240.0,2099 36,1979.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1972.5" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">证据足以支持当前结论？</tspan></text><text x="240.0" y="1998.5" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">结果能够定位到具体版本和原始记录。</tspan></text></a></g><g class="flow-node" data-node-id="recheck-revise" aria-label="修订与复核。排查差异、补实验或收窄结论；不能删除不利样本凑结果。"><a href="https://csma-graduation-projects.github.io/templates.html#experiment" target="_blank"><title>修订与复核：排查差异、补实验或收窄结论；不能删除不利样本凑结果。</title><rect x="548" y="1859" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1884" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1909" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1934" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">排查差异、补实验或收窄结论；不能删除不利</tspan><tspan x="567" dy="20">样本凑结果。</tspan></text></a></g><g class="flow-node" data-node-id="package" aria-label="形成可复查实验包。提供配置、日志、分析脚本、README、限制与许可。"><a href="https://csma-graduation-projects.github.io/templates.html#archive" target="_blank"><title>形成可复查实验包：提供配置、日志、分析脚本、README、限制与许可。</title><rect x="36" y="2214" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2239" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成与后续</tspan></text><text x="55" y="2264" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">形成可复查实验包</tspan></text><text x="55" y="2289" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">提供配置、日志、分析脚本、README、限制与许可。</tspan></text></a></g><text x="36" y="2504" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：复现不承诺与原文数值完全一致。数据、配置和评价口径不同，应解释差异并限制结论；保留失败与超时记录。</tspan></text><text x="36" y="2557" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">CSMA 培养指南 · https://csma-graduation-projects.github.io/workflows.html#flow-reproduction</tspan></text></svg>
