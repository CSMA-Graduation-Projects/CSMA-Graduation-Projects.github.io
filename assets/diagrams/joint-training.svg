<svg xmlns="http://www.w3.org/2000/svg" width="920" height="3221" viewBox="0 0 920 3221" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">跨校联合培养流程图</title><desc id="diagram-desc">七个工作步骤连接接收或派出、共同指导、正式认定与交接；三处判断说明何时补充确认或返回整改。 实线向下推进，金色菱形为判断，虚线为整改后返回。这是工作指南，不代表已批准的校际项目。导师同意、学校批准、研究完成和正式认定分别记录；按本人适用制度与有权部门结论办理，共同指导不自动产生联合或双学位。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="3221" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">跨校联合培养流程图</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">七个工作步骤连接接收或派出、共同指导、正式认定与交接；三处判断说明何时补充确认或返回整改。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><path class="flow-edge" data-from="scope" data-to="requirements" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><path class="flow-edge" data-from="requirements" data-to="entry-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 594 L 240.0 704" /><text x="254.0" y="979" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="entry-check" data-to="plan" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 949 L 240.0 1059" /><text x="458" y="818.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="entry-check" data-to="entry-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 829.0 L 543 799.0" /><text x="548" y="910" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回要求与手续核对</tspan></text><path class="flow-edge" data-from="entry-revise" data-to="requirements" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 889 L 703.0 916 L 894 916 L 894 424 L 422 424 L 422 440" /><path class="flow-edge" data-from="plan" data-to="execute" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><path class="flow-edge" data-from="execute" data-to="review" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1479 L 240.0 1589" /><path class="flow-edge" data-from="review" data-to="stage-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1744 L 240.0 1854" /><text x="254.0" y="2129" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="stage-check" data-to="recognition" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2099 L 240.0 2209" /><text x="458" y="1968.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="stage-check" data-to="stage-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1979.0 L 543 1949.0" /><text x="548" y="2060" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回计划与任务安排</tspan></text><path class="flow-edge" data-from="stage-revise" data-to="plan" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 2039 L 703.0 2066 L 874 2066 L 874 1044 L 422 1044 L 422 1060" /><path class="flow-edge" data-from="recognition" data-to="recognition-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2364 L 240.0 2474" /><text x="254.0" y="2749" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">按结论衔接</tspan></text><path class="flow-edge" data-from="recognition-check" data-to="handover" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 2719 L 240.0 2829" /><text x="458" y="2588.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="recognition-check" data-to="recognition-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 2599.0 L 543 2569.0" /><text x="548" y="2680" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回认定办理</tspan></text><path class="flow-edge" data-from="recognition-revise" data-to="recognition" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 2659 L 703.0 2686 L 894 2686 L 894 2194 L 422 2194 L 422 2210" /><g class="flow-node" data-node-id="scope" aria-label="确认合作类型与角色。明确接收或派出、学籍与授位单位及合作范围。"><a href="https://csma-graduation-projects.github.io/joint-training.html#types" target="_blank"><title>确认合作类型与角色：明确接收或派出、学籍与授位单位及合作范围。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">确认合作类型与角色</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">明确接收或派出、学籍与授位单位及合作范围。</tspan></text></a></g><g class="flow-node" data-node-id="requirements" aria-label="核对要求与必要手续。逐项确认接收、指导资格、阶段认定和办理部门。"><a href="https://csma-graduation-projects.github.io/joint-training.html#stages" target="_blank"><title>核对要求与必要手续：逐项确认接收、指导资格、阶段认定和办理部门。</title><rect x="36" y="444" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">核对要求与必要手续</tspan></text><text x="55" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">逐项确认接收、指导资格、阶段认定和办理部门。</tspan></text></a></g><g class="flow-node" data-node-id="entry-check" aria-label="具备开始条件？。必要批准、资源权限和接收安排均已有依据。"><a href="https://csma-graduation-projects.github.io/joint-training.html#stages" target="_blank"><title>具备开始条件？：必要批准、资源权限和接收安排均已有依据。</title><polygon points="240.0,709 444,829.0 240.0,949 36,829.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="814.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">具备开始条件？</tspan></text><text x="240.0" y="840.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">必要批准、资源权限和接收安排均已有</tspan><tspan x="240.0" dy="17">依据。</tspan></text></a></g><g class="flow-node" data-node-id="entry-revise" aria-label="补齐手续和条件。联系对应部门补充确认；相关条件未满足前不启动依赖它的工作。"><a href="https://csma-graduation-projects.github.io/joint-training.html#stages" target="_blank"><title>补齐手续和条件：联系对应部门补充确认；相关条件未满足前不启动依赖它的工作。</title><rect x="548" y="709" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="734" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="759" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">补齐手续和条件</tspan></text><text x="567" y="784" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">联系对应部门补充确认；相关条件未满足前不</tspan><tspan x="567" dy="20">启动依赖它的工作。</tspan></text></a></g><g class="flow-node" data-node-id="plan" aria-label="共同制订个人计划。明确能力目标、任务、双方职责、截止日与检查证据。"><a href="https://csma-graduation-projects.github.io/joint-training.html#roles" target="_blank"><title>共同制订个人计划：明确能力目标、任务、双方职责、截止日与检查证据。</title><rect x="36" y="1064" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1089" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1114" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">共同制订个人计划</tspan></text><text x="55" y="1139" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">明确能力目标、任务、双方职责、截止日与检查证据。</tspan></text></a></g><g class="flow-node" data-node-id="execute" aria-label="研究执行与联合反馈。共用任务记录和材料版本，跟踪问题与反馈落实。"><a href="https://csma-graduation-projects.github.io/joint-training.html#coordination" target="_blank"><title>研究执行与联合反馈：共用任务记录和材料版本，跟踪问题与反馈落实。</title><rect x="36" y="1329" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1354" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1379" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">研究执行与联合反馈</tspan></text><text x="55" y="1404" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">共用任务记录和材料版本，跟踪问题与反馈落实。</tspan></text></a></g><g class="flow-node" data-node-id="review" aria-label="阶段检查与材料准备。学生自检，导师复核；按双方要求整理正式提交材料。"><a href="https://csma-graduation-projects.github.io/joint-training.html#stages" target="_blank"><title>阶段检查与材料准备：学生自检，导师复核；按双方要求整理正式提交材料。</title><rect x="36" y="1594" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1619" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1644" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">阶段检查与材料准备</tspan></text><text x="55" y="1669" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">学生自检，导师复核；按双方要求整理正式提交材料。</tspan></text></a></g><g class="flow-node" data-node-id="stage-check" aria-label="交付和研究检查达到要求？。证据支持约定结论，待处理意见和正式材料缺项已明确。"><a href="https://csma-graduation-projects.github.io/joint-training.html#stages" target="_blank"><title>交付和研究检查达到要求？：证据支持约定结论，待处理意见和正式材料缺项已明确。</title><polygon points="240.0,1859 444,1979.0 240.0,2099 36,1979.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1964.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">交付和研究检查达到要求？</tspan></text><text x="240.0" y="1990.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">证据支持约定结论，待处理意见和正式</tspan><tspan x="240.0" dy="17">材料缺项已明确。</tspan></text></a></g><g class="flow-node" data-node-id="stage-revise" aria-label="整改或调整计划。写明缺口、负责人和复查日期；涉及正式节点的变化按规定办理。"><a href="https://csma-graduation-projects.github.io/joint-training.html#coordination" target="_blank"><title>整改或调整计划：写明缺口、负责人和复查日期；涉及正式节点的变化按规定办理。</title><rect x="548" y="1859" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1884" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1909" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">整改或调整计划</tspan></text><text x="567" y="1934" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">写明缺口、负责人和复查日期；涉及正式节点</tspan><tspan x="567" dy="20">的变化按规定办理。</tspan></text></a></g><g class="flow-node" data-node-id="recognition" aria-label="办理适用的正式认定。向有权部门提交，分别保存回执、结论和下一步要求。"><a href="https://csma-graduation-projects.github.io/joint-training.html#stages" target="_blank"><title>办理适用的正式认定：向有权部门提交，分别保存回执、结论和下一步要求。</title><rect x="36" y="2214" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2239" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="2264" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">办理适用的正式认定</tspan></text><text x="55" y="2289" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">向有权部门提交，分别保存回执、结论和下一步要求。</tspan></text></a></g><g class="flow-node" data-node-id="recognition-check" aria-label="认定状态已明确？。适用事项有正式结论；无需认定的事项已有依据，未通过不记作通过。"><a href="https://csma-graduation-projects.github.io/joint-training.html#stages" target="_blank"><title>认定状态已明确？：适用事项有正式结论；无需认定的事项已有依据，未通过不记作通过。</title><polygon points="240.0,2479 444,2599.0 240.0,2719 36,2599.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="2584.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">认定状态已明确？</tspan></text><text x="240.0" y="2610.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">适用事项有正式结论；无需认定的事项</tspan><tspan x="240.0" dy="17">已有依据，未通过不记作通过。</tspan></text></a></g><g class="flow-node" data-node-id="recognition-revise" aria-label="补件、复核或重新安排。按反馈补充材料，或使用正式复核渠道；约定等待期间与后续安排。"><a href="https://csma-graduation-projects.github.io/joint-training.html#coordination" target="_blank"><title>补件、复核或重新安排：按反馈补充材料，或使用正式复核渠道；约定等待期间与后续安排。</title><rect x="548" y="2479" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="2504" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="2529" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">补件、复核或重新安排</tspan></text><text x="567" y="2554" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">按反馈补充材料，或使用正式复核渠道；约定</tspan><tspan x="567" dy="20">等待期间与后续安排。</tspan></text></a></g><g class="flow-node" data-node-id="handover" aria-label="进入下一阶段或结束交接。根据结论衔接后续培养，归档材料、确认留存与访问权限。"><a href="https://csma-graduation-projects.github.io/joint-training.html#closure" target="_blank"><title>进入下一阶段或结束交接：根据结论衔接后续培养，归档材料、确认留存与访问权限。</title><rect x="36" y="2834" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="2859" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成与后续</tspan></text><text x="55" y="2884" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">进入下一阶段或结束交接</tspan></text><text x="55" y="2909" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">根据结论衔接后续培养，归档材料、确认留存与访问权限。</tspan></text></a></g><text x="36" y="3124" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：这是工作指南，不代表已批准的校际项目。导师同意、学校批准、研究完成和正式认定分别记录；按本人适用制度与有权</tspan><tspan x="36" dy="21">部门结论办理，共同指导不自动产生联合或双学位。</tspan></text><text x="36" y="3198" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">CSMA 培养指南 · https://csma-graduation-projects.github.io/workflows.html#flow-joint-training</tspan></text></svg>
