<svg xmlns="http://www.w3.org/2000/svg" width="920" height="2315" viewBox="0 0 920 2315" role="img" aria-labelledby="diagram-title diagram-desc" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><title id="diagram-title">日常推进：任务、反馈与下一步</title><desc id="diagram-desc">把每次沟通落到可交付任务、负责人、证据和复查日期。 实线向下推进，金色菱形为判断，虚线为整改后返回。建议节奏由学生与导师结合课程和研究约定；正式出勤、请假、实践和考核使用学校制度与指定渠道。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426a71" /></marker><marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a77931" /></marker></defs><rect width="920" height="2315" fill="#f7f8f6" /><text x="36" y="45" font-size="25" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="36" dy="0">日常推进：任务、反馈与下一步</tspan></text><text x="36" y="77" font-size="14" fill="#243c4d" font-weight="400" text-anchor="start"><tspan x="36" dy="0">把每次沟通落到可交付任务、负责人、证据和复查日期。</tspan></text><text x="36" y="123" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">向下推进；未满足走右侧整改支路；沿虚线返回对应步骤。点击节点打开在线说明。</tspan></text><text x="458" y="818.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="work-check" data-to="work-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 829.0 L 543 799.0" /><text x="548" y="910" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回任务与安排</tspan></text><path class="flow-edge" data-from="work-revise" data-to="plan" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 889 L 703.0 916 L 879 916 L 879 159 L 422 159 L 422 175" /><text x="458" y="1703.0" font-size="12" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="458" dy="0">未满足</tspan></text><path class="flow-edge" data-from="feedback-check" data-to="feedback-revise" data-edge-type="fail" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 444 1714.0 L 543 1684.0" /><text x="548" y="1795" font-size="11" fill="#805b28" font-weight="400" text-anchor="start"><tspan x="548" dy="0">↶ 返回实施与修改</tspan></text><path class="flow-edge" data-from="feedback-revise" data-to="work" data-edge-type="return" fill="none" stroke-width="2" stroke="#a77931" marker-end="url(#return-arrow)" stroke-dasharray="6 5" d="M 703.0 1774 L 703.0 1801 L 889 1801 L 889 424 L 422 424 L 422 440" /><path class="flow-edge" data-from="plan" data-to="work" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 329 L 240.0 439" /><path class="flow-edge" data-from="work" data-to="work-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 594 L 240.0 704" /><text x="254.0" y="979" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="work-check" data-to="report" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 949 L 240.0 1059" /><path class="flow-edge" data-from="report" data-to="feedback" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1214 L 240.0 1324" /><path class="flow-edge" data-from="feedback" data-to="feedback-check" data-edge-type="next" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1479 L 240.0 1589" /><text x="254.0" y="1864" font-size="12" fill="#24685f" font-weight="400" text-anchor="start"><tspan x="254.0" dy="0">满足后继续</tspan></text><path class="flow-edge" data-from="feedback-check" data-to="close" data-edge-type="pass" fill="none" stroke-width="2" stroke="#426a71" marker-end="url(#arrow)" d="M 240.0 1834 L 240.0 1944" /><g class="flow-node" data-node-id="plan" aria-label="约定目标与完成条件。写清任务、负责人、输入、交付物、检查日期及需要的帮助。"><a href="https://csma-graduation-projects.github.io/templates.html#research-task" target="_blank"><title>约定目标与完成条件：写清任务、负责人、输入、交付物、检查日期及需要的帮助。</title><rect x="36" y="179" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="204" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="229" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">约定目标与完成条件</tspan></text><text x="55" y="254" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">写清任务、负责人、输入、交付物、检查日期及需要的帮助。</tspan></text></a></g><g class="flow-node" data-node-id="work" aria-label="执行并保留过程记录。每天更新实际版本和结果，阻塞及时说明影响与尝试。"><a href="https://csma-graduation-projects.github.io/management.html#working-rhythm" target="_blank"><title>执行并保留过程记录：每天更新实际版本和结果，阻塞及时说明影响与尝试。</title><rect x="36" y="444" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="469" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="494" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">执行并保留过程记录</tspan></text><text x="55" y="519" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">每天更新实际版本和结果，阻塞及时说明影响与尝试。</tspan></text></a></g><g class="flow-node" data-node-id="work-check" aria-label="输入、资源与安排仍可执行？。遇到阻塞尽早求助，不等截止后补造进度。"><a href="https://csma-graduation-projects.github.io/management.html#working-rhythm" target="_blank"><title>输入、资源与安排仍可执行？：遇到阻塞尽早求助，不等截止后补造进度。</title><polygon points="240.0,709 444,829.0 240.0,949 36,829.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="814.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">输入、资源与安排仍可执行？</tspan></text><text x="240.0" y="840.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">遇到阻塞尽早求助，不等截止后补造进</tspan><tspan x="240.0" dy="17">度。</tspan></text></a></g><g class="flow-node" data-node-id="work-revise" aria-label="修订与复核。说明原因与备选方案，协商缩范围、改期或必要的正式变更。"><a href="https://csma-graduation-projects.github.io/templates.html#change-request" target="_blank"><title>修订与复核：说明原因与备选方案，协商缩范围、改期或必要的正式变更。</title><rect x="548" y="709" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="734" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="759" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="784" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">说明原因与备选方案，协商缩范围、改期或必</tspan><tspan x="567" dy="20">要的正式变更。</tspan></text></a></g><g class="flow-node" data-node-id="report" aria-label="提交周报与待讨论问题。区分事实、解释和计划，附可访问的证据。"><a href="https://csma-graduation-projects.github.io/templates.html#weekly" target="_blank"><title>提交周报与待讨论问题：区分事实、解释和计划，附可访问的证据。</title><rect x="36" y="1064" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1089" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1114" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">提交周报与待讨论问题</tspan></text><text x="55" y="1139" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">区分事实、解释和计划，附可访问的证据。</tspan></text></a></g><g class="flow-node" data-node-id="feedback" aria-label="讨论并形成行动项。记录决定、未决问题、修改位置、责任人与期限。"><a href="https://csma-graduation-projects.github.io/templates.html#meeting" target="_blank"><title>讨论并形成行动项：记录决定、未决问题、修改位置、责任人与期限。</title><rect x="36" y="1329" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1354" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">工作步骤</tspan></text><text x="55" y="1379" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">讨论并形成行动项</tspan></text><text x="55" y="1404" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">记录决定、未决问题、修改位置、责任人与期限。</tspan></text></a></g><g class="flow-node" data-node-id="feedback-check" aria-label="交付满足约定条件？。由实际材料支持完成状态，正式考核另记官方结果。"><a href="https://csma-graduation-projects.github.io/templates.html#meeting" target="_blank"><title>交付满足约定条件？：由实际材料支持完成状态，正式考核另记官方结果。</title><polygon points="240.0,1594 444,1714.0 240.0,1834 36,1714.0" fill="#f6edda" stroke="#ad894a" stroke-width="2" /><text x="240.0" y="1699.0" font-size="16" fill="#684e26" font-weight="700" text-anchor="middle"><tspan x="240.0" dy="0">交付满足约定条件？</tspan></text><text x="240.0" y="1725.0" font-size="12" fill="#684e26" font-weight="400" text-anchor="middle"><tspan x="240.0" dy="0">由实际材料支持完成状态，正式考核另</tspan><tspan x="240.0" dy="17">记官方结果。</tspan></text></a></g><g class="flow-node" data-node-id="feedback-revise" aria-label="修订与复核。逐项落实反馈；有争议的结论保留待确认并约定复查。"><a href="https://csma-graduation-projects.github.io/templates.html#weekly" target="_blank"><title>修订与复核：逐项落实反馈；有争议的结论保留待确认并约定复查。</title><rect x="548" y="1594" width="310" height="180" rx="9" fill="#fffaf0" stroke="#baa371" stroke-width="1.5" /><text x="567" y="1619" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="567" dy="0">整改支路</tspan></text><text x="567" y="1644" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="567" dy="0">修订与复核</tspan></text><text x="567" y="1669" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="567" dy="0">逐项落实反馈；有争议的结论保留待确认并约</tspan><tspan x="567" dy="20">定复查。</tspan></text></a></g><g class="flow-node" data-node-id="close" aria-label="完成复查并安排下一轮。记录完成依据，继续任务另建下一轮目标。"><a href="https://csma-graduation-projects.github.io/management.html#task-status" target="_blank"><title>完成复查并安排下一轮：记录完成依据，继续任务另建下一轮目标。</title><rect x="36" y="1949" width="408" height="150" rx="9" fill="#ffffff" stroke="#9db2b5" stroke-width="1.5" /><text x="55" y="1974" font-size="11" fill="#617777" font-weight="400" text-anchor="start"><tspan x="55" dy="0">完成与后续</tspan></text><text x="55" y="1999" font-size="16" fill="#14375f" font-weight="700" text-anchor="start"><tspan x="55" dy="0">完成复查并安排下一轮</tspan></text><text x="55" y="2024" font-size="13" fill="#485e69" font-weight="400" text-anchor="start"><tspan x="55" dy="0">记录完成依据，继续任务另建下一轮目标。</tspan></text></a></g><text x="36" y="2239" font-size="13" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">使用边界：建议节奏由学生与导师结合课程和研究约定；正式出勤、请假、实践和考核使用学校制度与指定渠道。</tspan></text><text x="36" y="2292" font-size="11" fill="#536674" font-weight="400" text-anchor="start"><tspan x="36" dy="0">CSMA 培养指南 · https://csma-graduation-projects.github.io/workflows.html#flow-feedback</tspan></text></svg>
