# GitHub Pages uses Jekyll to generate news and data-driven showcase pages.
# Internal audit materials must never be copied into the generated Pages site.
url: "https://csma-graduation-projects.github.io"
baseurl: ""
timezone: Asia/Shanghai
permalink: /news/:year-:month-:day-:title.html

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: news
  - scope:
      path: ""
      type: essays
    values:
      layout: essay
      lang: zh-CN
  - scope:
      path: ""
      type: essays_en
    values:
      layout: essay-en
      lang: en
  - scope:
      path: ""
      type: news_en
    values:
      layout: news-en
      lang: en

collections:
  essays:
    output: true
    permalink: /essays/:name.html
  essays_en:
    output: true
    permalink: /en/essays/:name.html
  news_en:
    output: true
    permalink: /en/news/:name.html

exclude:
  - work
  - node_modules
  - dist
  - vendor
  - scripts
  - docs/content-templates
  - docs/training-redesign

include:
  - .well-known
  # Jekyll 3.10 also prefix-matches the excluded work directory.
  # Include this public page explicitly while keeping work/ excluded.
  - workflows.html
